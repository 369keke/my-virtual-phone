<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9bb8df">
<title>我的小手机</title>
<style>
:root{
  --wallpaper: linear-gradient(155deg,#a9c9f4 0%,#c8d5ed 48%,#e7d9ec 100%);
    --ink:#172033; --glass:rgba(255,255,255,.43); --line:rgba(255,255,255,.48);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
    body{background:#111;display:flex;align-items:center;justify-content:center}
    .phone{
      position:relative;width:min(100vw,430px);height:100dvh;max-height:920px;min-height:560px;
        overflow:hidden;background:var(--wallpaper);isolation:isolate;
        }
        .phone:before{
          content:"";position:absolute;inset:0;z-index:-2;
            background:
              radial-gradient(ellipse at 80% 20%,rgba(255,255,255,.48),transparent 36%),
                radial-gradient(ellipse at 12% 68%,rgba(255,255,255,.25),transparent 38%),
                  linear-gradient(160deg,#86afe5 0%,#b6c9e7 45%,#e8d9e9 100%);
                  }
                  .phone:after{
                    content:"";position:absolute;inset:48% -12% -8%;z-index:-1;opacity:.35;
                      background:linear-gradient(145deg,transparent 18%,rgba(53,82,119,.45) 19% 28%,transparent 29%),
                                   linear-gradient(25deg,transparent 20%,rgba(255,255,255,.55) 21% 22%,transparent 23%);
                                     filter:blur(12px);
                                     }
                                     .status{
                                       height:52px;padding: max(env(safe-area-inset-top),12px) 22px 0;
                                         display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:650;letter-spacing:.1px;
                                         }
                                         .status-left,.status-right{display:flex;align-items:center;gap:7px;white-space:nowrap}
                                         .status-right{gap:6px}
                                         .signal{height:15px;display:flex;align-items:flex-end;gap:2px}
                                         .signal i{display:block;width:3px;border-radius:2px;background:currentColor}
                                         .signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:14px}
                                         .wifi{width:17px;height:13px;position:relative;overflow:hidden}
                                         .wifi:before,.wifi:after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:2px solid currentColor;border-color:currentColor transparent transparent;border-radius:50%}
                                         .wifi:before{width:19px;height:19px;top:2px}.wifi:after{width:11px;height:11px;top:7px}
                                         .wifi b{position:absolute;width:4px;height:4px;background:currentColor;border-radius:50%;bottom:0;left:7px}
                                         .battery{width:27px;height:13px;border:1.5px solid currentColor;border-radius:4px;position:relative;padding:1px}
                                         .battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;border-radius:0 2px 2px 0;background:currentColor}
                                         .battery span{display:block;width:82%;height:100%;border-radius:2px;background:currentColor}
                                         .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:31px;border-radius:22px;background:#090a0d;box-shadow:0 1px 2px #0002}
                                         .content{height:calc(100% - 52px);padding:22px 22px 18px;display:flex;flex-direction:column}
                                         .clock{font-size:clamp(54px,16vw,76px);font-weight:300;letter-spacing:-3.8px;line-height:1.02;margin:8px 0 3px}
                                         .date{font-size:15px;font-weight:550;margin-left:3px}
                                         .weather{
                                           margin-top:28px;height:142px;border-radius:27px;padding:20px 22px;
                                             background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.48);
                                               box-shadow:0 8px 30px rgba(61,82,119,.06);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
                                               }
                                               .weather-label{font-size:13px;color:#536176;font-weight:550}
                                               .weather-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
                                               .temp{font-size:39px;font-weight:300;letter-spacing:-1.5px}
                                               .weather-desc{font-size:12px;color:#536176;margin-top:1px}
                                               .sun{font-size:38px;filter:drop-shadow(0 3px 5px #e7b34b55);margin-right:5px}
                                               .apps{display:grid;grid-template-columns:repeat(4,1fr);column-gap:7px;row-gap:18px;margin-top:25px;flex:1;align-content:start}
                                               .app{border:0;background:none;color:inherit;padding:0;display:flex;align-items:center;flex-direction:column;gap:6px;min-width:0}
                                               .icon{
                                                 width:clamp(58px,18vw,76px);height:clamp(58px,18vw,76px);border-radius:21px;
                                                   display:grid;place-items:center;font-size:34px;color:white;
                                                     box-shadow:inset 0 1px 2px #ffffff9c,0 5px 12px #3b4d6c20;
                                                       border:1px solid #ffffff55;text-shadow:0 1px 2px #0002;
                                                       }
                                                       .app-name{font-size:12px;font-weight:500;text-shadow:0 1px 5px #ffffff90;white-space:nowrap}
                                                       .green{background:linear-gradient(145deg,#56df9a,#0cae69)}
                                                       .calendar{background:linear-gradient(145deg,#fff,#e7ebf2);color:#db4d4d;text-shadow:none}
                                                       .photos{background:linear-gradient(145deg,#ffcf75,#f18f56)}
                                                       .camera{background:linear-gradient(145deg,#9daab7,#435365)}
                                                       .yellow{background:linear-gradient(145deg,#ffe66d,#eabf25)}
                                                       .music{background:linear-gradient(145deg,#ff7e9b,#d93c70)}
                                                       .gray{background:linear-gradient(145deg,#aebbc8,#657487)}
                                                       .blue{background:linear-gradient(145deg,#55c5ff,#1677d7)}
                                                       .folder{background:linear-gradient(145deg,#71caff,#287fc8)}
                                                       .heart{background:linear-gradient(145deg,#ff8c9e,#e34566)}
                                                       .purple{background:linear-gradient(145deg,#8c83ff,#5149d7)}
                                                       .dock{
                                                         margin:8px -3px max(8px,env(safe-area-inset-bottom));height:91px;border-radius:29px;
                                                           display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:9px 12px;
                                                             background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.42);
                                                               box-shadow:0 8px 28px #44557518;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
                                                               }
                                                               .dock .icon{width:58px;height:58px;border-radius:18px;font-size:28px}
                                                               .home-indicator{position:absolute;bottom:max(5px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:8px;background:#1d243055}
                                                               .app-view{position:absolute;inset:0;background:rgba(246,248,252,.97);z-index:5;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px 28px;backdrop-filter:blur(24px)}
                                                               .app-view.show{display:flex}
                                                               .app-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 22px}
                                                               .app-head h2{font-size:27px;margin:0;font-weight:700}
                                                               .back{border:0;background:#e7ebf2;color:#247bd4;border-radius:20px;padding:9px 14px;font-size:15px}
                                                               .panel{background:white;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #24334b0a}
                                                               textarea{width:100%;height:42vh;border:0;outline:0;resize:none;font:16px/1.6 inherit;color:#202b3c}
                                                               input,button{font-family:inherit}
                                                               .action{border:0;border-radius:14px;background:#1684e8;color:white;padding:11px 16px;font-size:15px}
                                                               .muted{color:#7c8797;font-size:13px}
                                                               .chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
                                                               .bubble{align-self:flex-end;background:#2f9bff;color:white;padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:82%;line-height:1.45}
                                                               .chat-input{display:flex;gap:8px;margin-top:12px}
                                                               .chat-input input{flex:1;min-width:0;border:0;background:#fff;border-radius:18px;padding:12px 14px;font-size:15px}
                                                               .wallpapers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
                                                               .wallpapers button{height:70px;border:2px solid white;border-radius:15px}
                                                               .photo-preview{width:100%;max-height:45vh;object-fit:contain;border-radius:16px}
                                                               @media(min-width:600px){.phone{height:min(92dvh,900px);border-radius:38px;border:8px solid #20232a;box-shadow:0 18px 70px #0008}.island{top:12px}}
                                                               </style>
                                                               </head>
                                                               <body>
                                                               <main class="phone" id="phone">
                                                                 <div class="status">
                                                                     <div class="status-left"><span id="statusTime">09:41</span><span id="statusMark">◔</span></div>
                                                                         <div class="status-right">
                                                                               <span class="signal"><i></i><i></i><i></i><i></i></span>
                                                                                     <span class="wifi"><b></b></span>
                                                                                           <span class="battery"><span></span></span><span id="batteryText">98</span>
                                                                                               </div>
                                                                                                 </div>
                                                                                                   <div class="island"></div>
                                                                                                     <section class="content">
                                                                                                         <div class="clock" id="bigClock">09:41</div>
                                                                                                             <div class="date" id="dateText">10月31日 星期六</div>
                                                                                                                 <div class="weather">
                                                                                                                       <div class="weather-label">天气 · 今天</div>
                                                                                                                             <div class="weather-row"><div><div class="temp">23°</div><div class="weather-desc">晴朗 · 适合出门</div></div><div class="sun">☀️</div></div>
                                                                                                                                 </div>
                                                                                                                                     <div class="apps">
                                                                                                                                           <button class="app" onclick="openApp('消息')"><span class="icon green">●</span><span class="app-name">信息</span></button>
                                                                                                                                                 <button class="app" onclick="openApp('日历')"><span class="icon calendar">📅</span><span class="app-name">日历</span></button>
                                                                                                                                                       <button class="app" onclick="openApp('照片')"><span class="icon photos">🌈</span><span class="app-name">照片</span></button>
                                                                                                                                                             <button class="app" onclick="openApp('相机')"><span class="icon camera">📷</span><span class="app-name">相机</span></button>
                                                                                                                                                                   <button class="app" onclick="openApp('手记')"><span class="icon yellow">📝</span><span class="app-name">手记</span></button>
                                                                                                                                                                         <button class="app" onclick="openApp('音乐')"><span class="icon music">♫</span><span class="app-name">音乐</span></button>
                                                                                                                                                                               <button class="app" onclick="openApp('时钟')"><span class="icon gray">◷</span><span class="app-name">时钟</span></button>
                                                                                                                                                                                     <button class="app" onclick="openApp('设置')"><span class="icon gray">⚙</span><span class="app-name">设置</span></button>
                                                                                                                                                                                           <button class="app" onclick="openApp('邮件')"><span class="icon blue">✉</span><span class="app-name">邮件</span></button>
                                                                                                                                                                                                 <button class="app" onclick="openApp('文件')"><span class="icon folder">▰</span><span class="app-name">文件</span></button>
                                                                                                                                                                                                       <button class="app" onclick="openApp('健康')"><span class="icon heart">♥</span><span class="app-name">健康</span></button>
                                                                                                                                                                                                             <button class="app" onclick="openApp('App Store')"><span class="icon purple">🛍</span><span class="app-name">App Store</span></button>
                                                                                                                                                                                                                 </div>
                                                                                                                                                                                                                     <div class="dock">
                                                                                                                                                                                                                           <button class="app" onclick="openApp('电话')"><span class="icon green">☎</span></button>
                                                                                                                                                                                                                                 <button class="app" onclick="openApp('消息')"><span class="icon blue">●</span></button>
                                                                                                                                                                                                                                       <button class="app" onclick="openApp('音乐')"><span class="icon music">♫</span></button>
                                                                                                                                                                                                                                             <button class="app" onclick="openApp('浏览器')"><span class="icon gray">◎</span></button>
                                                                                                                                                                                                                                                 </div>
                                                                                                                                                                                                                                                   </section>
                                                                                                                                                                                                                                                     <div class="home-indicator"></div>

                                                                                                                                                                                                                                                       <section class="app-view" id="appView">
                                                                                                                                                                                                                                                           <div class="app-head"><button class="back" onclick="closeApp()">‹ 返回</button><h2 id="appTitle">应用</h2><span style="width:55px"></span></div>
                                                                                                                                                                                                                                                               <div id="appBody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
                                                                                                                                                                                                                                                                 </section>
                                                                                                                                                                                                                                                                 </main>
                                                                                                                                                                                                                                                                 <script>
                                                                                                                                                                                                                                                                 const $ = id => document.getElementById(id);
                                                                                                                                                                                                                                                                 function updateTime(){
                                                                                                                                                                                                                                                                   const now=new Date(), time=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
                                                                                                                                                                                                                                                                     $('statusTime').textContent=time;$('bigClock').textContent=time;
                                                                                                                                                                                                                                                                       const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
                                                                                                                                                                                                                                                                         $('dateText').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                         updateTime();setInterval(updateTime,1000);
                                                                                                                                                                                                                                                                         function openApp(name){
                                                                                                                                                                                                                                                                           $('appTitle').textContent=name;$('appView').classList.add('show');
                                                                                                                                                                                                                                                                             const body=$('appBody');
                                                                                                                                                                                                                                                                               if(name==='手记'){
                                                                                                                                                                                                                                                                                   body.innerHTML=`<div class="panel"><div class="muted">自动保存在这台设备</div><textarea id="noteText" placeholder="记录一点今天的想法……"></textarea></div>`;
                                                                                                                                                                                                                                                                                       $('noteText').value=localStorage.getItem('myPhoneNote')||'';
                                                                                                                                                                                                                                                                                           $('noteText').addEventListener('input',e=>localStorage.setItem('myPhoneNote',e.target.value));
                                                                                                                                                                                                                                                                                             }else if(name==='音乐'){
                                                                                                                                                                                                                                                                                                 body.innerHTML=`<div class="panel" style="text-align:center;margin-top:35px"><div style="font-size:76px">🎵</div><h2>此刻的音乐</h2><p class="muted">选择播放状态，享受一点时间</p><button class="action" id="musicBtn">▶ 播放</button></div>`;
                                                                                                                                                                                                                                                                                                     $('musicBtn').onclick=()=>{$('musicBtn').textContent=$('musicBtn').textContent.includes('播放')?'Ⅱ 暂停':'▶ 播放'};
                                                                                                                                                                                                                                                                                                       }else if(name==='日历'){
                                                                                                                                                                                                                                                                                                           const n=new Date();body.innerHTML=`<div class="panel"><h2>${n.getFullYear()}年${n.getMonth()+1}月</h2><p>今天是 ${n.getDate()} 日</p><p class="muted">把重要的日子记在这里吧。</p></div>`;
                                                                                                                                                                                                                                                                                                             }else if(name==='照片'||name==='相机'){
                                                                                                                                                                                                                                                                                                                 body.innerHTML=`<div class="panel"><h3>${name==='相机'?'选择一张照片进行模拟预览':'照片图库'}</h3><input type="file" accept="image/*" id="photoInput"><div id="photoArea" style="margin-top:14px"></div></div>`;
                                                                                                                                                                                                                                                                                                                     $('photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=document.createElement('img');img.className='photo-preview';img.src=URL.createObjectURL(f);$('photoArea').replaceChildren(img)};
                                                                                                                                                                                                                                                                                                                       }else if(name==='设置'){
                                                                                                                                                                                                                                                                                                                           body.innerHTML=`<div class="panel"><h3>外观</h3><p class="muted">选择桌面壁纸色调</p><div class="wallpapers"><button style="background:linear-gradient(135deg,#86afe5,#e8d9e9)" onclick="setWall(0)"></button><button style="background:linear-gradient(135deg,#f3a9c5,#d6b5e9)" onclick="setWall(1)"></button><button style="background:linear-gradient(135deg,#8bd6c0,#d9edc9)" onclick="setWall(2)"></button><button style="background:linear-gradient(135deg,#8e9ce7,#c4b9ef)" onclick="setWall(3)"></button></div></div><div class="panel"><h3>关于本机</h3><p class="muted">我的小手机 · 网页体验版</p></div>`;
                                                                                                                                                                                                                                                                                                                             }else if(name==='消息'){
                                                                                                                                                                                                                                                                                                                                 body.innerHTML=`<div class="chatlog" id="chatLog"><div class="panel muted">这里是聊天演示。发送的内容只在当前页面显示。</div></div><div class="chat-input"><input id="chatInput" placeholder="输入消息……"><button class="action" id="sendBtn">发送</button></div>`;
                                                                                                                                                                                                                                                                                                                                     const send=()=>{const v=$('chatInput').value.trim();if(!v)return;const b=document.createElement('div');b.className='bubble';b.textContent=v;$('chatLog').appendChild(b);$('chatInput').value='';$('chatLog').scrollTop=$('chatLog').scrollHeight};
                                                                                                                                                                                                                                                                                                                                         $('sendBtn').onclick=send;$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
                                                                                                                                                                                                                                                                                                                                           }else{
                                                                                                                                                                                                                                                                                                                                               body.innerHTML=`<div class="panel"><div style="font-size:48px;text-align:center;margin:20px">✨</div><h3 style="text-align:center">${name}</h3><p class="muted" style="text-align:center">这是 ${name} 的演示页面，更多功能可以继续添加。</p></div>`;
                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                 function closeApp(){$('appView').classList.remove('show')}
                                                                                                                                                                                                                                                                                                                                                 function setWall(i){
                                                                                                                                                                                                                                                                                                                                                   const walls=[
                                                                                                                                                                                                                                                                                                                                                       'linear-gradient(155deg,#86afe5 0%,#b6c9e7 48%,#e8d9e9 100%)',
                                                                                                                                                                                                                                                                                                                                                           'linear-gradient(155deg,#f3a9c5 0%,#d9c1e9 55%,#f7dce2 100%)',
                                                                                                                                                                                                                                                                                                                                                               'linear-gradient(155deg,#8bd6c0 0%,#c6e5d4 55%,#e9efcf 100%)',
                                                                                                                                                                                                                                                                                                                                                                   'linear-gradient(155deg,#8e9ce7 0%,#bcbbea 55%,#e2d8f2 100%)'
                                                                                                                                                                                                                                                                                                                                                                     ];
                                                                                                                                                                                                                                                                                                                                                                       document.documentElement.style.setProperty('--wallpaper',walls[i]);localStorage.setItem('myPhoneWall',i);
                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                       const savedWall=localStorage.getItem('myPhoneWall');if(savedWall!==null)setWall(Number(savedWall));
                                                                                                                                                                                                                                                                                                                                                                       </script>
                                                                                                                                                                                                                                                                                                                                                                       </body>
                                                                                                                                                                                                                                                                                                                                                                       </html>
