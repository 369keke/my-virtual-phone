<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小手机 · 微信</title>
<style>
:root{--green:#07c160;--bg:#ededed;--ink:#171717;--muted:#888;--line:#e8e8e8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#dfe6e9,#c9d6df);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.phone{width:min(420px,100%);height:min(850px,calc(100vh - 36px));min-height:600px;background:#111;border-radius:38px;padding:10px;box-shadow:0 22px 60px #0004;position:relative}
.screen{height:100%;background:#f7f7f7;border-radius:29px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:28px;background:#f7f7f7;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12px;font-weight:600;flex-shrink:0}
.app{flex:1;min-height:0;display:flex;flex-direction:column}
.page{display:none;flex:1;min-height:0;flex-direction:column}.page.active{display:flex}
.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#f7f7f7;border-bottom:1px solid #eee;flex-shrink:0}
.topbar h1{font-size:17px;margin:0;font-weight:650}.top-actions{display:flex;gap:15px;align-items:center}.iconbtn{border:0;background:none;font-size:23px;padding:2px;cursor:pointer;color:#171717}
.list{overflow:auto;flex:1;background:#fff}.row{height:72px;display:flex;align-items:center;padding:0 13px;gap:11px;border-bottom:1px solid #f1f1f1;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#d9e5dc;display:grid;place-items:center;font-size:22px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.rowmain{flex:1;min-width:0}.rowtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:#aaa;white-space:nowrap}.preview{font-size:13px;color:#999;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:#fa5151;color:white;border-radius:12px;min-width:17px;height:17px;padding:0 5px;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.tabbar{height:57px;background:#f9f9f9;border-top:1px solid #e7e7e7;display:flex;justify-content:space-around;align-items:center;flex-shrink:0}
.tab{border:0;background:none;color:#888;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:55px;cursor:pointer}.tab .ti{font-size:21px;line-height:22px}.tab.active{color:var(--green)}
.chathead{display:flex;align-items:center;gap:10px}.back{font-size:24px;border:0;background:none;padding:0 6px 0 0;cursor:pointer}.chatname{font-size:16px;font-weight:600}
.messages{flex:1;overflow:auto;padding:16px 12px;background:#ededed;display:flex;flex-direction:column;gap:14px}
.msgline{display:flex;gap:8px;align-items:flex-start}.msgline.mine{flex-direction:row-reverse}.msgline .avatar{width:37px;height:37px;border-radius:5px}
.bubble{max-width:74%;padding:10px 11px;border-radius:5px;background:white;font-size:15px;line-height:1.45;overflow-wrap:anywhere;position:relative}.mine .bubble{background:#95ec69}.bubble img{max-width:100%;max-height:180px;display:block;border-radius:4px}.msgtime{font-size:10px;color:#999;text-align:center;margin-top:4px}.status{cursor:pointer}.status b{font-weight:500;margin-left:5px}
.composer{display:flex;align-items:center;gap:8px;padding:9px;background:#f7f7f7;border-top:1px solid #ddd;flex-shrink:0}
.plus-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 12px 20px;background:#f7f7f7;border-top:1px solid #eee}.plus-panel button{border:0;background:#fff;border-radius:10px;min-height:66px;font-size:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#222}.plus-panel button span{font-size:12px}.call-overlay{position:absolute;inset:0;background:#dce6e4;z-index:7;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}.call-overlay.show{display:flex}.call-overlay .call-avatar{width:92px;height:92px;border-radius:22px;overflow:hidden;background:#fff;margin-bottom:18px}.call-overlay .call-avatar img{width:100%;height:100%;object-fit:cover}.call-overlay h2{font-size:22px;margin:5px}.call-overlay p{color:#777}.call-actions{display:flex;gap:40px;margin-top:70px}.call-actions button{border:0;border-radius:50%;width:64px;height:64px;background:#e34b4b;color:#fff;font-size:25px}
.quick-sheet{position:absolute;inset:0;background:#0006;z-index:9;display:none;align-items:flex-end}.quick-sheet.show{display:flex}.quick-card{width:100%;background:#f7f7f7;border-radius:18px 18px 0 0;padding:18px 16px 28px;max-height:85%;overflow:auto}.quick-card h3{font-size:17px;margin:0 0 14px}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}.quick-grid button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#222}.quick-grid i{font-style:normal;background:white;border-radius:14px;width:56px;height:56px;display:grid;place-items:center;font-size:25px}.quick-form{display:grid;gap:12px}.quick-form label{font-size:13px;color:#666}.quick-form input,.quick-form textarea{display:block;width:100%;margin-top:6px;border:1px solid #ddd;border-radius:9px;padding:12px;background:white;font:16px inherit}.quick-buttons{display:flex;gap:10px;margin-top:8px}.quick-buttons button{flex:1;border:0;border-radius:9px;padding:13px;font-size:15px}.q-primary{background:#07c160;color:white}.q-cancel{background:#e8e8e8;color:#333}.selectbar{display:none;background:#fff;padding:9px 12px;gap:8px;align-items:center;border-top:1px solid #eee}.selectbar.show{display:flex}.selectbar button{border:0;border-radius:7px;padding:9px 12px;background:#07c160;color:#fff}.msgpick{width:20px;height:20px;align-self:center;accent-color:#07c160}.msgline.picked .bubble{outline:2px solid #07c160}
.composer textarea{resize:none;flex:1;min-height:38px;max-height:90px;border:0;border-radius:6px;padding:9px;font:15px inherit;outline:none;background:white}
.send{background:var(--green);color:white;border:0;border-radius:5px;padding:9px 13px;font-size:14px;cursor:pointer}
.smallbtn{border:0;background:#fff;border-radius:5px;padding:8px 10px;font-size:13px;cursor:pointer}
.sectiontitle{padding:14px 15px 8px;color:#888;font-size:12px;background:#f7f7f7}
.contactrow{height:62px}.contactrow .avatar{width:42px;height:42px}
.profile{padding:24px 18px;background:#fff;display:flex;align-items:center;gap:15px;margin-top:10px;cursor:pointer}
.profile .avatar{width:64px;height:64px}.profile strong{font-size:18px}.profile p{margin:7px 0 0;color:#888;font-size:13px}
.settingrow{background:#fff;padding:16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:15px}
.settingrow small{color:#999}.form{padding:16px;overflow:auto}.field{margin-bottom:15px}.field label{display:block;font-size:13px;color:#777;margin-bottom:7px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:6px;font:14px inherit;background:white}.field textarea{min-height:75px}
.primary{width:100%;padding:12px;border:0;border-radius:6px;background:var(--green);color:white;font-size:15px;margin-top:6px;cursor:pointer}
.empty{padding:50px 20px;text-align:center;color:#aaa;font-size:14px}
.home{flex:1;background:linear-gradient(145deg,#e9f4ee,#dce9e3);display:flex;align-items:flex-start;justify-content:center;padding-top:70px}
.appicon{width:78px;text-align:center;cursor:pointer;color:#333;font-size:12px}.wechatlogo{width:58px;height:58px;margin:0 auto 8px;border-radius:14px;object-fit:contain;display:block;box-shadow:0 5px 12px #0002}
.modalbg{position:absolute;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modalbg.show{display:flex}.modal{background:white;border-radius:12px;padding:18px;width:100%;max-width:320px}.modal h3{margin:0 0 14px;font-size:17px}.modal input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:12px}.modalactions{display:flex;justify-content:flex-end;gap:10px}
.toast{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:#333d;color:white;padding:8px 13px;border-radius:20px;font-size:12px;display:none;z-index:8}
@media(max-height:650px){.phone{height:calc(100vh - 16px);min-height:0;padding:6px;border-radius:28px}.screen{border-radius:23px}}
</style>
</head>
<body>
<div class="phone"><div class="screen">
 <div class="status" onclick="editStatus()" title="点击调整状态栏"><span id="clock">10:08</span><span>●●●　 Wi-Fi　▰ <b id="batteryText">100%</b></span></div>
  <div class="app">
    <section id="desktop" class="page active"><div class="home"><div class="appicon" onclick="openWechat()"><img class="wechatlogo" src="wechat_original_cropped.png" alt="微信图标">微信</div></div></section>
      <section id="wechat" class="page">
         <div class="topbar"><h1 id="mainTitle">微信</h1><div class="top-actions"><button class="iconbtn" onclick="showSearch()" title="搜索">⌕</button><button class="iconbtn" onclick="addContact()" title="添加联系人">＋</button></div></div>
            <div id="tabChats" class="list"></div><div id="tabContacts" class="list" style="display:none"></div>
               <div id="tabDiscover" class="list" style="display:none"><div class="settingrow" onclick="toast('朋友圈功能后续可以继续完善')">朋友圈 <span>›</span></div><div class="settingrow" onclick="toast('收藏功能后续可以继续完善')">收藏 <span>›</span></div></div>
                  <div id="tabMe" class="list" style="display:none">
                      <div class="profile" onclick="editSelf()"><div class="avatar" id="selfAvatar">🙂</div><div><strong id="selfName">我</strong><p id="selfId">微信号：mywechat</p></div><span style="margin-left:auto;color:#aaa">›</span></div>
                          <div style="height:12px"></div><div class="settingrow" onclick="editSelf()">个人信息 <span>›</span></div><div class="settingrow" onclick="toast('设置页面后续可扩展')">设置 <span>›</span></div>
                             </div>
                                <div class="tabbar">
                                    <button class="tab active" data-tab="Chats" onclick="switchTab('Chats')"><span class="ti">☏</span>微信</button>
                                        <button class="tab" data-tab="Contacts" onclick="switchTab('Contacts')"><span class="ti">♙</span>通讯录</button>
                                            <button class="tab" data-tab="Discover" onclick="switchTab('Discover')"><span class="ti">◉</span>发现</button>
                                                <button class="tab" data-tab="Me" onclick="switchTab('Me')"><span class="ti">♟</span>我</button>
                                                   </div>
                                                     </section>
                                                       <section id="chat" class="page">
                                                          <div class="topbar"><div class="chathead"><button class="back" onclick="backToWechat()">‹</button><span class="chatname" id="chatTitle">聊天</span></div><div class="top-actions"><button class="smallbtn" onclick="goHome()">桌面</button><button class="iconbtn" onclick="chatOptions()">···</button></div></div>
                                                             <div class="messages" id="messages"></div>
                                                                <div class="selectbar" id="selectBar"><span id="selectedCount" style="flex:1;font-size:13px">已选 0 条</span><button onclick="previewSelectedShot()">预览截图</button><button onclick="exitSelectMode()" style="background:#888">取消</button></div><div class="composer"><button class="smallbtn" onclick="togglePlusPanel()">＋</button><textarea id="messageInput" rows="1" placeholder="发送消息"></textarea><button class="send" onclick="sendMessage()">发送</button></div>
<div id="plusPanel" class="plus-panel" style="display:none"><button onclick="chooseImage()">▧<span>照片</span></button><button onclick="startCall('语音通话')">☎<span>语音通话</span></button><button onclick="startCall('视频通话')">▣<span>视频通话</span></button><button onclick="openQuickForm('红包')">🧧<span>红包</span></button><button onclick="openQuickForm('转账')">￥<span>转账</span></button><button onclick="openQuickForm('日期时间')">◷<span>日期时间</span></button><button onclick="openQuickForm('系统旁白')">▤<span>系统旁白</span></button><button onclick="openQuickForm('位置')">⌖<span>位置</span></button><button onclick="openQuickForm('背景设置')">▧<span>背景设置</span></button><button onclick="openQuickForm('外观设计')">⚙<span>外观设计</span></button><button onclick="enterSelectMode()">▣<span>生成截图</span></button></div>
<input id="imageInput" type="file" accept="image/*" hidden onchange="sendImage(event)"><input id="chatAvatarInput" type="file" accept="image/*" hidden onchange="changeChatAvatar(event)">
                                                                     </section>
                                                                       <section id="editor" class="page">
                                                                          <div class="topbar"><button class="back" onclick="backFromEditor()">‹</button><h1 id="editorTitle">编辑资料</h1><button class="iconbtn" onclick="saveEditor()">✓</button></div>
                                                                             <div class="form">
                                                                                 <div class="field"><label>头像</label><div style="display:flex;align-items:center;gap:12px"><div class="avatar" id="previewAvatar">🙂</div><button class="smallbtn" onclick="document.getElementById('avatarInput').click()">更换头像</button><input id="avatarInput" type="file" accept="image/*" hidden onchange="previewImage(event)"></div></div>
                                                                                     <div class="field"><label>昵称</label><input id="editName" maxlength="30"></div>
                                                                                         <div class="field" id="idField"><label>微信号</label><input id="editId" maxlength="40"></div>
                                                                                             <div class="field"><label>个性签名</label><textarea id="editSign" maxlength="100"></textarea></div>
                                                                                                 <button class="primary" onclick="saveEditor()">保存</button>
                                                                                                     <button class="primary" id="deleteContactBtn" style="background:#e65b5b;display:none" onclick="deleteCurrentContact()">删除联系人</button>
                                                                                                        </div>
                                                                                                          </section>
                                                                                                           </div>
                                                                                                            <div class="modalbg" id="modal"><div class="modal"><h3 id="modalTitle">添加联系人</h3><input id="modalInput" placeholder="输入联系人昵称"><div class="modalactions"><button class="smallbtn" onclick="closeModal()">取消</button><button class="send" onclick="confirmModal()">确定</button></div></div></div>
                                                                                                             <div class="quick-sheet" id="quickSheet" onclick="if(event.target===this)closeQuickSheet()"><div class="quick-card"><h3 id="quickTitle">操作</h3><div id="quickBody"></div></div></div><div class="call-overlay" id="callOverlay"><div class="call-avatar" id="callAvatar"></div><h2 id="callTitle">语音通话</h2><p id="callStatus">正在呼叫…（模拟界面）</p><div class="call-actions"><button onclick="endCall()">×</button><button onclick="toast('本地模拟通话，不会连接真实电话')">▣</button></div></div><div class="toast" id="toast"></div>
                                                                                                             </div></div>
                                                                                                             <script>
                                                                                                             const KEY='mini_wechat_phone_v1';
                                                                                                             const defaultData={self:{name:'我',wxid:'mywechat',sign:'',avatar:''},contacts:[
                                                                                                             {id:'c1',name:'示例联系人',wxid:'friend001',sign:'你好，很高兴认识你',avatar:'',unread:0,messages:[{from:'them',type:'text',text:'你好！欢迎来到你的小微信。',time:Date.now()-60000}]}
                                                                                                             ]};
                                                                                                             let data=loadData(), currentId=null, editTarget='self', pendingAvatar=null, modalMode='add';
let statusPrefs=JSON.parse(localStorage.getItem("mini_phone_status")||'{"time":"","battery":100,"showMessageTime":true}');
                                                                                                             function loadData(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultData)}catch(e){return JSON.parse(JSON.stringify(defaultData))}}
                                                                                                             function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
                                                                                                             function page(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
function goHome(){page("desktop")}
function editStatus(){let t=prompt("设置状态栏时间（例如 09:41；留空使用当前时间）",statusPrefs.time||"");if(t===null)return;let b=prompt("设置电量百分比（0-100）",String(statusPrefs.battery??100));if(b===null)return;statusPrefs.time=t.trim();statusPrefs.battery=Math.max(0,Math.min(100,parseInt(b)||0));localStorage.setItem("mini_phone_status",JSON.stringify(statusPrefs));updateClock()}
                                                                                                             function openWechat(){page('wechat');renderAll()}
                                                                                                             function backToWechat(){page('wechat');renderAll()}
                                                                                                             function switchTab(tab){['Chats','Contacts','Discover','Me'].forEach(t=>{document.getElementById('tab'+t).style.display=t===tab?'block':'none'});document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('mainTitle').textContent=({Chats:'微信',Contacts:'通讯录',Discover:'发现',Me:'我'})[tab];document.querySelector('.top-actions').style.visibility=tab==='Chats'?'visible':tab==='Contacts'?'visible':'hidden';renderAll()}
                                                                                                             function avatarHTML(src, fallback='🙂'){return src?'<img src="'+src+'">':fallback}
                                                                                                             function renderAll(){renderChats();renderContacts();renderSelf()}
                                                                                                             function renderSelf(){document.getElementById('selfAvatar').innerHTML=avatarHTML(data.self.avatar);document.getElementById('selfName').textContent=data.self.name;document.getElementById('selfId').textContent='微信号：'+data.self.wxid}
                                                                                                             function renderChats(){let el=document.getElementById('tabChats');el.innerHTML='';let sorted=[...data.contacts].sort((a,b)=>(b.messages.at(-1)?.time||0)-(a.messages.at(-1)?.time||0));if(!sorted.length){el.innerHTML='<div class="empty">还没有聊天，点击右上角＋添加联系人</div>';return}sorted.forEach(c=>{let last=c.messages.at(-1);let preview=last?(last.type==='image'?'[图片]':last.text):'暂无消息';let row=document.createElement('div');row.className='row';row.innerHTML='<div class="avatar">'+avatarHTML(c.avatar)+'</div><div class="rowmain"><div class="rowtop"><span class="name"></span><span class="time">'+(last?fmtTime(last.time):'')+'</span></div><div class="preview"></div></div>'+(c.unread?'<span class="badge">'+c.unread+'</span>':'');row.querySelector('.name').textContent=c.name;row.querySelector('.preview').textContent=preview;row.onclick=()=>openChat(c.id);el.appendChild(row)})}
                                                                                                             function renderContacts(){let el=document.getElementById('tabContacts');el.innerHTML='<div class="sectiontitle">我的联系人</div>';data.contacts.forEach(c=>{let r=document.createElement('div');r.className='row contactrow';r.innerHTML='<div class="avatar">'+avatarHTML(c.avatar)+'</div><div class="rowmain"><div class="name"></div></div>';r.querySelector('.name').textContent=c.name;r.onclick=()=>openChat(c.id);el.appendChild(r)});if(!data.contacts.length)el.innerHTML+='<div class="empty">暂无联系人，点击右上角＋添加</div>'}
                                                                                                             function fmtTime(t){let d=new Date(t);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):`${d.getMonth()+1}/${d.getDate()}`}
                                                                                                             function current(){return data.contacts.find(c=>c.id===currentId)}
                                                                                                             function openChat(id){currentId=id;let c=current();if(!c)return;c.unread=0;persist();document.getElementById('chatTitle').textContent=c.name;page('chat');renderMessages()}
                                                                                                             function renderMessages(){let c=current(),el=document.getElementById('messages');if(!c)return;el.innerHTML='';c.messages.forEach((m,i)=>{let mine=m.from==='me',row=document.createElement('div');row.className='msgline'+(mine?' mine':'');let av=mine?data.self.avatar:c.avatar;let fallback=mine?'🙂':'🙂';row.innerHTML='<div class="avatar">'+avatarHTML(av,fallback)+'</div><div class="bubble"></div>';row.querySelector('.avatar').style.cursor='pointer';row.querySelector('.avatar').title='点击更换头像';row.querySelector('.avatar').onclick=()=>chooseChatAvatar(mine?'self':'contact');let bubble=row.querySelector('.bubble');if(m.type==='image'){let im=document.createElement('img');im.src=m.text;bubble.appendChild(im)}else bubble.textContent=m.text;if(statusPrefs.showMessageTime){let tm=document.createElement("div");tm.className="msgtime";tm.textContent=new Date(m.time).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});bubble.appendChild(tm)}if(selectMode){let pick=document.createElement("input");pick.type="checkbox";pick.className="msgpick";pick.checked=selectedMessages.has(i);pick.onchange=()=>toggleMessagePick(i);row.prepend(pick);row.classList.toggle("picked",pick.checked)}else{bubble.style.cursor="pointer";bubble.title="点击编辑消息";bubble.onclick=()=>openMessageActions(i)}el.appendChild(row)});el.scrollTop=el.scrollHeight}
                                                                                                             function sendMessage(){let input=document.getElementById('messageInput'),textVal=input.value.trim();if(!textVal)return;let c=current();c.messages.push({from:'me',type:'text',text:textVal,time:Date.now()});input.value='';persist();renderMessages();renderChats()}
                                                                                                             document.getElementById('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
                                                                                                             function chooseImage(){document.getElementById('imageInput').click()}
function togglePlusPanel(){let p=document.getElementById("plusPanel");p.style.display=p.style.display==="none"?"grid":"none"}
function chooseChatAvatar(which){window.avatarEditTarget=which;document.getElementById("chatAvatarInput").click()}
function changeChatAvatar(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{if(window.avatarEditTarget==="self")data.self.avatar=rd.result;else{let c=current();if(c)c.avatar=rd.result}persist();renderMessages();renderAll();toast("头像已更换")};rd.readAsDataURL(f);e.target.value=""}
function startCall(kind){let c=current();if(!c)return;document.getElementById("plusPanel").style.display="none";document.getElementById("callTitle").textContent=kind;document.getElementById("callStatus").textContent="正在呼叫 "+c.name+"…（模拟界面）";document.getElementById("callAvatar").innerHTML=avatarHTML(c.avatar);document.getElementById("callOverlay").classList.add("show")}
function endCall(){document.getElementById("callOverlay").classList.remove("show");toast("通话已结束（模拟）")}
function closeQuickSheet(){document.getElementById("quickSheet").classList.remove("show")}
function openQuickForm(kind){document.getElementById("plusPanel").style.display="none";document.getElementById("quickTitle").textContent=kind;let body=document.getElementById("quickBody");let fields="";
if(kind==="红包")fields='<label>红包金额（元）<input id="qAmount" type="number" min="0.01" step="0.01" placeholder="例如 8.88"></label><label>祝福语<input id="qNote" placeholder="恭喜发财"></label>';
else if(kind==="转账")fields='<label>转账金额（元）<input id="qAmount" type="number" min="0.01" step="0.01" placeholder="例如 20.00"></label><label>转账说明<input id="qNote" placeholder="请输入说明（可选）"></label>';
else if(kind==="日期时间")fields='<label>时间文字<input id="qNote" placeholder="例如 04:25"></label>';
else if(kind==="系统旁白")fields='<label>旁白内容<textarea id="qNote" placeholder="输入要显示的系统旁白"></textarea></label>';
else if(kind==="位置")fields='<label>位置名称<input id="qNote" placeholder="输入地点名称"></label>';
else if(kind==="背景设置")fields='<label>聊天背景颜色<input id="qColor" type="color" value="#ededed"></label>';
else fields='<label>气泡颜色<input id="qColor" type="color" value="#95ec69"></label>';
body.innerHTML='<div class="quick-form">'+fields+'<div class="quick-buttons"><button class="q-cancel" onclick="closeQuickSheet()">取消</button><button class="q-primary" onclick="confirmQuickForm(\''+kind+'\')">确定</button></div></div>';document.getElementById("quickSheet").classList.add("show")}
function confirmQuickForm(kind){let c=current();if(!c)return;let note=document.getElementById("qNote")?.value||"",amount=document.getElementById("qAmount")?.value||"";
if((kind==="红包"||kind==="转账")&&(!amount||Number(amount)<=0)){toast("请输入有效金额");return}
if(["红包","转账","日期时间","系统旁白","位置"].includes(kind)){if(!note.trim()&&kind!=="红包"&&kind!=="转账"){toast("请先填写内容");return}let text=kind==="红包"?"🧧 微信红包  ¥"+amount+"\n"+(note||"恭喜发财"):kind==="转账"?"￥ 转账  ¥"+amount+(note?"\n"+note:"")+"\n待确认（模拟）":kind==="日期时间"?note:kind==="系统旁白"?"—— "+note+" ——":"📍 "+note;c.messages.push({from:kind==="日期时间"?"them":"me",type:"text",text,time:Date.now()})}
if(kind==="背景设置")document.getElementById("messages").style.background=document.getElementById("qColor").value;
if(kind==="外观设计")document.documentElement.style.setProperty("--green",document.getElementById("qColor").value);
persist();renderMessages();renderChats();closeQuickSheet()}
let selectMode=false,selectedMessages=new Set();
function enterSelectMode(){document.getElementById("plusPanel").style.display="none";selectMode=true;selectedMessages.clear();document.getElementById("selectBar").classList.add("show");renderMessages();toast("点选要放进截图的消息")}
function exitSelectMode(){selectMode=false;selectedMessages.clear();document.getElementById("selectBar").classList.remove("show");renderMessages()}
function toggleMessagePick(i){if(selectedMessages.has(i))selectedMessages.delete(i);else selectedMessages.add(i);document.getElementById("selectedCount").textContent="已选 "+selectedMessages.size+" 条";renderMessages()}
function previewSelectedShot(){let c=current();if(!c||!selectedMessages.size){toast("请先点选要截图的消息");return}let chosen=[...selectedMessages].sort((a,b)=>a-b).map(i=>c.messages[i]);let html='<div style="background:#ededed;border-radius:10px;padding:12px;max-height:45vh;overflow:auto"><b>'+c.name+' · 截图预览</b>'+chosen.map(m=>'<div style="margin:10px 0;text-align:'+(m.from==="me"?"right":"left")+'"><span style="display:inline-block;padding:9px 12px;border-radius:7px;background:'+(m.from==="me"?'#95ec69':'white')+';max-width:85%;text-align:left">'+(m.type==="image"?"[图片]":escapeHTML(m.text))+'</span><div style="font-size:10px;color:#888">'+fmtTime(m.time)+'</div></div>').join("")+'</div><div class="quick-buttons"><button class="q-cancel" onclick="closeQuickSheet()">返回</button><button class="q-primary" onclick="downloadSelectedShot()">保存 PNG</button></div>';document.getElementById("quickTitle").textContent="截图预览（"+chosen.length+"条）";document.getElementById("quickBody").innerHTML=html;document.getElementById("quickSheet").classList.add("show")}
function escapeHTML(v){return String(v).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}
function downloadSelectedShot(){let c=current(),chosen=[...selectedMessages].sort((a,b)=>a-b).map(i=>c.messages[i]);let canvas=document.createElement("canvas"),ctx=canvas.getContext("2d"),w=900,pad=35,line=90;canvas.width=w;canvas.height=100+chosen.length*line;ctx.fillStyle="#ededed";ctx.fillRect(0,0,w,canvas.height);ctx.fillStyle="#222";ctx.font="bold 26px sans-serif";ctx.fillText(c.name, pad,48);chosen.forEach((m,i)=>{let y=75+i*line,mine=m.from==="me",txt=m.type==="image"?"[图片消息]":String(m.text).slice(0,90),x=mine?330:pad;ctx.fillStyle=mine?"#95ec69":"#fff";ctx.fillRect(x,y,535,52);ctx.fillStyle="#222";ctx.font="20px sans-serif";ctx.fillText(txt,x+14,y+33);ctx.fillStyle="#888";ctx.font="13px sans-serif";ctx.fillText(fmtTime(m.time),x,y+72)});let a=document.createElement("a");a.download="聊天截图.png";a.href=canvas.toDataURL("image/png");a.click();closeQuickSheet();exitSelectMode();toast("截图已保存")}
                                                                                                             function sendImage(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{current().messages.push({from:'me',type:'image',text:reader.result,time:Date.now()});persist();renderMessages();renderChats()};reader.readAsDataURL(f);e.target.value=''}
                                                                                                             function addContact(){modalMode='add';document.getElementById('modalTitle').textContent='添加联系人';document.getElementById('modalInput').value='';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('modalInput').focus(),50)}
                                                                                                             function showSearch(){modalMode='search';document.getElementById('modalTitle').textContent='搜索联系人';document.getElementById('modalInput').value='';document.getElementById('modalInput').placeholder='输入昵称';document.getElementById('modal').classList.add('show')}
                                                                                                             function closeModal(){document.getElementById('modal').classList.remove('show')}
                                                                                                             function confirmModal(){let v=document.getElementById('modalInput').value.trim();closeModal();if(!v)return;if(modalMode==='search'){let c=data.contacts.find(x=>x.name.includes(v));if(c)openChat(c.id);else toast('没有找到联系人');return}let c={id:'c'+Date.now(),name:v,wxid:'wx'+Math.random().toString(36).slice(2,8),sign:'',avatar:'',unread:0,messages:[]};data.contacts.push(c);persist();renderAll();openChat(c.id)}
                                                                                                             function editSelf(){editTarget='self';let x=data.self;fillEditor(x,false)}
                                                                                                             function editContact(id){editTarget=id;fillEditor(data.contacts.find(c=>c.id===id),true)}
                                                                                                             function fillEditor(x,isContact){if(!x)return;pendingAvatar=x.avatar||'';document.getElementById('editorTitle').textContent=isContact?'联系人资料':'个人信息';document.getElementById('previewAvatar').innerHTML=avatarHTML(pendingAvatar);document.getElementById('editName').value=x.name||'';document.getElementById('editId').value=x.wxid||'';document.getElementById('editSign').value=x.sign||'';document.getElementById('idField').style.display='block';document.getElementById('deleteContactBtn').style.display=isContact?'block':'none';page('editor')}
                                                                                                             function previewImage(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{pendingAvatar=rd.result;document.getElementById('previewAvatar').innerHTML=avatarHTML(pendingAvatar)};rd.readAsDataURL(f);e.target.value=''}
                                                                                                             function saveEditor(){let x=editTarget==='self'?data.self:data.contacts.find(c=>c.id===editTarget);if(!x)return;x.name=document.getElementById('editName').value.trim()||'未命名';x.wxid=document.getElementById('editId').value.trim();x.sign=document.getElementById('editSign').value.trim();x.avatar=pendingAvatar||'';persist();if(currentId&&editTarget===currentId)document.getElementById('chatTitle').textContent=x.name;page(editTarget==='self'?'wechat':'chat');renderAll();if(editTarget!=='self')renderMessages();toast('资料已保存')}
                                                                                                             function backFromEditor(){page(editTarget==='self'?'wechat':'chat')}
                                                                                                             function deleteCurrentContact(){if(!confirm('确定删除这个联系人及其聊天记录吗？'))return;data.contacts=data.contacts.filter(c=>c.id!==editTarget);currentId=null;persist();page('wechat');renderAll()}
                                                                                                             function chatOptions(){let c=current();if(!c)return;let choice=prompt("聊天设置：\n1 修改联系人资料\n2 模拟对方回复\n3 清空聊天记录\n4 导出聊天截图 PNG\n5 编辑最后一条消息\n6 调整状态栏\n7 返回手机桌面\n8 显示/隐藏消息时间");if(choice==="1")editContact(c.id);if(choice==="2"){let t=prompt("输入对方要发送的消息");if(t){c.messages.push({from:"them",type:"text",text:t,time:Date.now()});persist();renderMessages();renderChats()}}if(choice==="3"&&confirm("清空与"+c.name+"的聊天记录？")){c.messages=[];persist();renderMessages();renderChats()}if(choice==="4")exportChatPNG();if(choice==="5")editLastMessage();if(choice==="6")editStatus();if(choice==="7")goHome();if(choice==="8"){statusPrefs.showMessageTime=!statusPrefs.showMessageTime;localStorage.setItem("mini_phone_status",JSON.stringify(statusPrefs));renderMessages()}}
function openMessageActions(i){let c=current(),m=c?.messages[i];if(!m)return;document.getElementById("quickTitle").textContent="消息操作";document.getElementById("quickBody").innerHTML='<div class="quick-grid"><button onclick="editMessageField('+i+',\'text\')"><i>✎</i>编辑内容</button><button onclick="editMessageField('+i+',\'time\')"><i>◷</i>修改时间</button><button onclick="deleteMessageAt('+i+')"><i>⌫</i>删除消息</button><button onclick="closeQuickSheet()"><i>×</i>取消</button></div>';document.getElementById("quickSheet").classList.add("show")}
function editMessageField(i,field){let c=current(),m=c?.messages[i];if(!m)return;let label=field==="text"?"消息内容":"消息时间";let val=field==="text"?(m.text||""):new Date(m.time).toLocaleString("zh-CN",{hour12:false});document.getElementById("quickTitle").textContent=label;document.getElementById("quickBody").innerHTML='<div class="quick-form"><label>'+label+(field==="text"?'<textarea id="editMessageValue">'+escapeHTML(val)+'</textarea>':'<input id="editMessageValue" value="'+escapeHTML(val)+'">')+'</label><div class="quick-buttons"><button class="q-cancel" onclick="closeQuickSheet()">取消</button><button class="q-primary" onclick="saveMessageField('+i+',\''+field+'\')">保存</button></div></div>'}
function saveMessageField(i,field){let m=current()?.messages[i];if(!m)return;let v=document.getElementById("editMessageValue").value;if(field==="text")m.text=v;else{let d=new Date(v.replace(/-/g,"/"));if(isNaN(d)){toast("时间格式不正确");return}m.time=d.getTime()}persist();closeQuickSheet();renderMessages();renderChats()}
function deleteMessageAt(i){let c=current();if(!c)return;c.messages.splice(i,1);persist();closeQuickSheet();renderMessages();renderChats()}
function editLastMessage(){let c=current();if(!c||!c.messages.length){toast("暂无消息");return}let m=c.messages[c.messages.length-1];if(m.type!=="text"){toast("暂时只支持编辑文字消息");return}let v=prompt("修改最后一条消息",m.text);if(v!==null){m.text=v;persist();renderMessages();renderChats()}}
function exportChatPNG(){let c=current();if(!c)return;let canvas=document.createElement("canvas"),ctx=canvas.getContext("2d"),w=900,lineH=78;canvas.width=w;canvas.height=110+Math.max(1,c.messages.length)*lineH;ctx.fillStyle="#ededed";ctx.fillRect(0,0,w,canvas.height);ctx.fillStyle="#222";ctx.font="bold 28px sans-serif";ctx.fillText(c.name,36,48);ctx.font="18px sans-serif";c.messages.forEach((m,i)=>{let y=82+i*lineH,mine=m.from==="me",txt=m.type==="image"?"[图片消息]":String(m.text).slice(0,100),x=mine?300:36;ctx.fillStyle=mine?"#95ec69":"#fff";ctx.fillRect(x,y,560,48);ctx.fillStyle="#222";ctx.fillText(txt,x+14,y+30);ctx.fillStyle="#888";ctx.font="13px sans-serif";ctx.fillText(new Date(m.time).toLocaleString("zh-CN",{hour12:false}),x,y+64);ctx.font="18px sans-serif"});let a=document.createElement("a");a.download="聊天截图.png";a.href=canvas.toDataURL("image/png");a.click();toast("已导出 PNG")}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',1800)}
                                                                                                             function updateClock(){document.getElementById("clock").textContent=statusPrefs.time||new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});let b=document.getElementById("batteryText");if(b)b.textContent=(statusPrefs.battery??100)+"%"}
                                                                                                             updateClock();setInterval(updateClock,30000);renderAll();
                                                                                                             </script>
                                                                                                             </body></html>
