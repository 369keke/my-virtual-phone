<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f5f5f5"><link rel="manifest" href="./manifest.json"><title>小手机 V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#222}button,input,textarea{font:inherit}button{border:0;cursor:pointer}#phone{max-width:480px;height:100dvh;min-height:550px;margin:auto;background:#f5f5f5;overflow:hidden;box-shadow:0 0 25px #0002}#status{height:30px;padding:5px 16px;font-size:12px;display:flex;justify-content:space-between}#app{height:calc(100% - 30px)}.screen{height:100%;display:none;flex-direction:column}.screen.active{display:flex}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#f8f8f8;border-bottom:1px solid #eee;font-weight:600}.body{flex:1;overflow:auto}.tabs{height:58px;display:flex;background:#fafafa;border-top:1px solid #ddd}.tabs button{flex:1;background:none;color:#777;font-size:12px}.tabs button.on{color:#07c160}.row{display:flex;gap:12px;align-items:center;padding:13px 15px;background:white;border-bottom:1px solid #eee}.avatar{width:48px;height:48px;border-radius:12px;background:#e2eee7;display:grid;place-items:center;font-size:24px;flex:none}.grow{flex:1;min-width:0}.hint{font-size:12px;color:#999;margin-top:5px}.primary{background:#07c160;color:white;padding:10px 15px;border-radius:8px}.soft{background:#eee;padding:9px 13px;border-radius:8px}.field{display:block;width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:8px 0;background:white}textarea.field{min-height:90px}.launcher{height:100%;padding:22px;background:linear-gradient(150deg,#d8e9df,#f5e6dc)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;margin-top:35px}.appicon{background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px}.appicon i{width:56px;height:56px;border-radius:16px;background:white;display:grid;place-items:center;font-size:25px;font-style:normal}.appicon.wx i{background:#07c160;color:white}.appicon.xhs i{background:#ff5266;color:white}.profileCover{height:145px;background:linear-gradient(130deg,#b7c9c0,#e8d7c9)}.profile{background:white;padding:0 15px 15px}.profileLine{display:flex;align-items:end;gap:12px;margin-top:-30px}.profileLine .avatar{width:76px;height:76px;border:3px solid white}.stats{display:flex;gap:24px;margin:17px 0}.stats b{display:block}.stats small{color:#999}.switch{display:flex;background:white}.switch button{flex:1;padding:13px;background:white}.switch button.on{border-bottom:2px solid #222;font-weight:bold}.post{background:white;margin:10px;padding:14px;border-radius:10px}.empty{text-align:center;color:#aaa;padding:55px 15px}.messages{padding:14px;display:flex;flex-direction:column;gap:10px}.bubble{background:white;border-radius:10px;padding:10px 12px;max-width:80%;align-self:flex-start;white-space:pre-wrap}.bubble.mine{background:#95ec69;align-self:flex-end}.inputbar{display:flex;gap:8px;padding:9px;background:#f8f8f8}.inputbar input{flex:1;min-width:0;border:0;border-radius:8px;padding:10px}.modal{position:absolute;inset:0;background:#0006;display:none;align-items:end}.modal.show{display:flex}.sheet{background:#f7f7f7;width:100%;max-width:480px;margin:auto auto 0;padding:17px;border-radius:16px 16px 0 0;max-height:85%;overflow:auto}.actions{display:flex;gap:8px;margin:12px 0}.actions button{flex:1}
</style></head><body><div id="phone"><div id="status"><span id="clock">16:30</span><span>5G　▮▮▮　▰</span></div><div id="app">
<section id="home" class="screen active"><div class="launcher"><b>我的小手机</b><h2 id="date"></h2><p>微信和小红书模拟体验</p><div class="grid"><button class="appicon wx" onclick="openScreen('wechat');wxTab('聊天')"><i>聊</i>微信</button><button class="appicon xhs" onclick="openScreen('xhs');renderXhs()"><i>书</i>小红书</button><button class="appicon" onclick="toast('更多应用即将开放')"><i>▤</i>文件</button><button class="appicon" onclick="toast('设置')"><i>⚙</i>设置</button></div></div></section>
<section id="wechat" class="screen"><header class="bar"><span id="wxTitle">微信</span><button class="soft" onclick="addContact()">＋</button></header><div id="wxBody" class="body"></div><nav class="tabs"><button onclick="wxTab('聊天')" id="tab聊天" class="on">▣<br>微信</button><button onclick="wxTab('通讯录')" id="tab通讯录">♙<br>通讯录</button><button onclick="wxTab('朋友圈')" id="tab朋友圈">◎<br>发现</button><button onclick="wxTab('我')" id="tab我">☻<br>我</button></nav></section>
<section id="chat" class="screen"><header class="bar"><button onclick="openScreen('wechat');wxTab('聊天')">‹</button><span id="chatName">聊天</span><button onclick="editContact()">···</button></header><div id="messages" class="body"></div><div class="inputbar"><input id="msg" placeholder="发送消息" onkeydown="if(event.key==='Enter')sendMsg()"><button class="primary" onclick="sendMsg()">发送</button></div></section>
<section id="xhs" class="screen"><header class="bar"><button onclick="openScreen('home')">‹</button><span id="xhsTitle">我的主页</span><button onclick="switchProfile()">切换</button></header><div id="xhsBody" class="body"></div></section>
</div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div id="sheetContent"></div></div></div></div>
<script>
const el=id=>document.getElementById(id),key='phone-v2';
const base={contacts:[{id:1,name:'小林',avatar:'🌿',messages:[{text:'在吗？',mine:false},{text:'在呀',mine:true}]}],moments:[],me:{name:'我',avatar:'🙂'},profiles:{me:{name:'我的主页',id:'888888',ip:'北京',bio:'记录生活，分享日常。',avatar:'🌷',following:99,fans:99,likes:99},other:{name:'momo',id:'123456',ip:'北京',bio:'个人标签',avatar:'🧸',following:99,fans:99,likes:99}},posts:{me:[],other:[]}};
let data;try{data=JSON.parse(localStorage.getItem(key))||base}catch(e){data=base}
let tab='聊天',activeContact=1,who='me',postTab='笔记';
function save(){localStorage.setItem(key,JSON.stringify(data))}
function toast(t){alert(t)}
function openScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));el(id).classList.add('active')}
function wxTab(t){tab=t;el('wxTitle').textContent=t;['聊天','通讯录','朋友圈','我'].forEach(x=>el('tab'+x).classList.toggle('on',x===t));renderWx()}
function renderWx(){let b=el('wxBody');if(tab==='聊天'||tab==='通讯录'){b.innerHTML=data.contacts.map(c=>'<div class="row" onclick="openChat('+c.id+')"><div class="avatar">'+safe(c.avatar)+'</div><div class="grow"><b>'+safe(c.name)+'</b><div class="hint">'+safe(c.messages.at(-1)?.text||'暂无消息')+'</div></div>›</div>').join('')||'<div class="empty">还没有联系人</div>'}else if(tab==='朋友圈'){b.innerHTML='<div class="row"><div class="grow">朋友圈</div><button class="primary" onclick="newMoment()">发表</button></div>'+data.moments.map((m,i)=>'<div class="row"><div class="avatar">'+safe(data.me.avatar)+'</div><div class="grow"><b>'+safe(data.me.name)+'</b><p>'+safe(m)+'</p><button class="soft" onclick="data.moments.splice('+i+',1);save();renderWx()">删除</button></div></div>').join('')}else{b.innerHTML='<div class="row" onclick="editMe()"><div class="avatar">'+safe(data.me.avatar)+'</div><div class="grow"><b>'+safe(data.me.name)+'</b><div class="hint">个人资料</div></div>›</div>'}}
function addContact(){modal('<h3>添加联系人</h3><input class="field" id="cn" placeholder="昵称"><input class="field" id="ca" placeholder="头像 emoji" value="🙂"><button class="primary" onclick="data.contacts.push({id:Date.now(),name:el(\'cn\').value,avatar:el(\'ca\').value,messages:[]});save();closeModal();wxTab(\'通讯录\')">保存</button>')}
function openChat(id){activeContact=id;let c=data.contacts.find(x=>x.id===id);el('chatName').textContent=c.name;openScreen('chat');renderChat()}
function renderChat(){let c=data.contacts.find(x=>x.id===activeContact);el('messages').innerHTML='<div class="messages">'+c.messages.map(m=>'<div class="bubble '+(m.mine?'mine':'')+'">'+safe(m.text)+'</div>').join('')+'</div>';el('messages').scrollTop=el('messages').scrollHeight}
function sendMsg(){let v=el('msg').value.trim();if(!v)return;data.contacts.find(x=>x.id===activeContact).messages.push({text:v,mine:true});el('msg').value='';save();renderChat()}
function editContact(){let c=data.contacts.find(x=>x.id===activeContact);modal('<h3>联系人资料</h3><input class="field" id="ename" value="'+safe(c.name)+'"><input class="field" id="eavatar" value="'+safe(c.avatar)+'"><button class="primary" onclick="cSave()">保存</button>')}
function cSave(){let c=data.contacts.find(x=>x.id===activeContact);c.name=el('ename').value;c.avatar=el('eavatar').value;save();closeModal();openChat(activeContact)}
function editMe(){modal('<h3>我的资料</h3><input class="field" id="mn" value="'+safe(data.me.name)+'"><input class="field" id="ma" value="'+safe(data.me.avatar)+'"><button class="primary" onclick="data.me.name=el(\'mn\').value;data.me.avatar=el(\'ma\').value;save();closeModal();renderWx()">保存</button>')}
function newMoment(){modal('<h3>发表朋友圈</h3><textarea class="field" id="mt" placeholder="说点什么…"></textarea><button class="primary" onclick="data.moments.unshift(el(\'mt\').value);save();closeModal();renderWx()">发表</button>')}
function switchProfile(){who=who==='me'?'other':'me';postTab='笔记';renderXhs()}
function renderXhs(){let p=data.profiles[who],posts=data.posts[who];el('xhsTitle').textContent=who==='me'?'我的主页':'访客主页';el('xhsBody').innerHTML='<div class="profileCover"></div><div class="profile"><div class="profileLine"><div class="avatar" onclick="editProfile()">'+safe(p.avatar)+'</div><b style="font-size:20px">'+safe(p.name)+'</b></div><div class="hint">小红书号：'+safe(p.id)+'　IP属地：'+safe(p.ip)+'</div><div class="stats"><div><b>'+p.following+'</b><small>关注</small></div><div><b>'+p.fans+'</b><small>粉丝</small></div><div><b>'+p.likes+'</b><small>获赞与收藏</small></div></div><p>'+safe(p.bio)+'</p>'+(who==='other'?'<div class="actions"><button class="primary" onclick="toast(\'已关注\')">关注</button><button class="soft" onclick="toast(\'私信功能\')">发私信</button></div>':'<button class="soft" onclick="editProfile()">编辑资料</button>')+'</div><div class="switch"><button class="'+(postTab==='笔记'?'on':'')+'" onclick="postTab=\'笔记\';renderXhs()">笔记</button><button class="'+(postTab==='收藏'?'on':'')+'" onclick="postTab=\'收藏\';renderXhs()">收藏</button></div>'+(postTab==='收藏'?'<div class="empty">暂无收藏</div>':posts.map((n,i)=>'<article class="post"><b>'+safe(n.title)+'</b><p>'+safe(n.text)+'</p><div class="hint">'+safe(p.name)+' · '+safe(n.date)+'</div><button class="soft" onclick="data.posts[who].splice('+i+',1);save();renderXhs()">删除</button></article>').join('')||'<div class="empty">还没有发布笔记</div>')+(who==='me'?'<div class="actions" style="padding:12px"><button class="primary" onclick="newPost()">＋ 发布笔记</button><button class="soft" onclick="switchProfile()">切换成别人的主页</button></div>':'')}
function editProfile(){let p=data.profiles[who];modal('<h3>编辑主页</h3><input class="field" id="pn" placeholder="昵称" value="'+safe(p.name)+'"><input class="field" id="pi" placeholder="小红书号" value="'+safe(p.id)+'"><input class="field" id="pip" placeholder="IP属地" value="'+safe(p.ip)+'"><input class="field" id="pa" placeholder="头像 emoji" value="'+safe(p.avatar)+'"><textarea class="field" id="pb">'+safe(p.bio)+'</textarea><div class="actions"><input class="field" id="pf" type="number" value="'+p.following+'"><input class="field" id="pfa" type="number" value="'+p.fans+'"><input class="field" id="pl" type="number" value="'+p.likes+'"></div><button class="primary" onclick="let p=data.profiles[who];p.name=el(\'pn\').value;p.id=el(\'pi\').value;p.ip=el(\'pip\').value;p.avatar=el(\'pa\').value;p.bio=el(\'pb\').value;p.following=+el(\'pf\').value;p.fans=+el(\'pfa\').value;p.likes=+el(\'pl\').value;save();closeModal();renderXhs()">保存资料</button>')}
function newPost(){modal('<h3>发布笔记</h3><input class="field" id="pt" placeholder="标题"><textarea class="field" id="px" placeholder="分享你的生活…"></textarea><button class="primary" onclick="data.posts[who].unshift({title:el(\'pt\').value,text:el(\'px\').value,date:new Date().toLocaleDateString()});save();closeModal();renderXhs()">发布</button>')}
function modal(s){el('sheetContent').innerHTML=s;el('modal').classList.add('show')}function closeModal(){el('modal').classList.remove('show')}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clock(){let d=new Date();el('clock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});el('date').textContent=d.toLocaleDateString('zh-CN',{weekday:'long',month:'long',day:'numeric'})}clock();setInterval(clock,30000);save();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
</script></body></html>
