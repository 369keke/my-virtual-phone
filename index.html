<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9bb8df">
<title>我的小手机</title>
<style>
:root{
  --wallpaper:linear-gradient(155deg,#86afe5 0%,#b6c9e7 48%,#e8d9e9 100%);
    --ink:#172033;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
    body{background:#111;display:flex;align-items:center;justify-content:center}
    .phone{position:relative;width:min(100vw,430px);height:100dvh;max-height:920px;min-height:560px;overflow:hidden;background:var(--wallpaper);isolation:isolate}
    .phone:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 80% 20%,rgba(255,255,255,.28),transparent 36%),radial-gradient(ellipse at 12% 68%,rgba(255,255,255,.16),transparent 38%),var(--wallpaper);background-size:cover;background-position:center}
    .phone:after{content:"";position:absolute;inset:48% -12% -8%;z-index:-1;opacity:.22;pointer-events:none;background:linear-gradient(145deg,transparent 18%,rgba(53,82,119,.45) 19% 28%,transparent 29%),linear-gradient(25deg,transparent 20%,rgba(255,255,255,.55) 21% 22%,transparent 23%);filter:blur(12px)}
    .status{height:52px;padding:max(env(safe-area-inset-top),12px) 22px 0;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:650;letter-spacing:.1px}
    .status-left,.status-right{display:flex;align-items:center;gap:7px;white-space:nowrap}.status-right{gap:6px}
    .signal{height:15px;display:flex;align-items:flex-end;gap:2px}.signal i{display:block;width:3px;border-radius:2px;background:currentColor}.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:14px}
    .wifi{width:17px;height:13px;position:relative;overflow:hidden}.wifi:before,.wifi:after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:2px solid currentColor;border-color:currentColor transparent transparent;border-radius:50%}.wifi:before{width:19px;height:19px;top:2px}.wifi:after{width:11px;height:11px;top:7px}.wifi b{position:absolute;width:4px;height:4px;background:currentColor;border-radius:50%;bottom:0;left:7px}
    .battery{width:27px;height:13px;border:1.5px solid currentColor;border-radius:4px;position:relative;padding:1px}.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;border-radius:0 2px 2px 0;background:currentColor}.battery span{display:block;width:82%;height:100%;border-radius:2px;background:currentColor}
    .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:31px;border-radius:22px;background:#090a0d;box-shadow:0 1px 2px #0002;z-index:1}
    .content{height:calc(100% - 52px);padding:22px 22px 18px;display:flex;flex-direction:column;position:relative;z-index:1}
    .clock{font-size:clamp(54px,16vw,76px);font-weight:300;letter-spacing:-3.8px;line-height:1.02;margin:8px 0 3px}.date{font-size:15px;font-weight:550;margin-left:3px}
    .weather{margin-top:28px;height:142px;flex-shrink:0;border-radius:27px;padding:20px 22px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.48);box-shadow:0 8px 30px rgba(61,82,119,.06);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
    .weather-label{font-size:13px;color:#536176;font-weight:550}.weather-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.temp{font-size:39px;font-weight:300;letter-spacing:-1.5px}.weather-desc{font-size:12px;color:#536176;margin-top:1px}.sun{font-size:38px;filter:drop-shadow(0 3px 5px #e7b34b55);margin-right:5px}
    .pages-viewport{width:100%;overflow:hidden;flex:1;min-height:0;touch-action:pan-y;position:relative}
    .pages-track{display:flex;width:200%;height:100%;transition:transform .32s cubic-bezier(.2,.75,.25,1);will-change:transform}
    .page-grid{width:50%;flex:0 0 50%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:7px;row-gap:18px;margin-top:25px;align-content:start}
    .app{border:0;background:none;color:inherit;padding:0;display:flex;align-items:center;flex-direction:column;gap:6px;min-width:0;cursor:pointer}
    .icon{width:clamp(58px,18vw,76px);height:clamp(58px,18vw,76px);border-radius:21px;display:grid;place-items:center;font-size:34px;color:white;box-shadow:inset 0 1px 2px #ffffff9c,0 5px 12px #3b4d6c20;border:1px solid #ffffff55;text-shadow:0 1px 2px #0002}
    .app-name{font-size:12px;font-weight:500;text-shadow:0 1px 5px #ffffff90;white-space:nowrap}
    .green{background:linear-gradient(145deg,#56df9a,#0cae69)}.calendar{background:linear-gradient(145deg,#fff,#e7ebf2);color:#db4d4d;text-shadow:none}.photos{background:linear-gradient(145deg,#ffcf75,#f18f56)}.camera{background:linear-gradient(145deg,#9daab7,#435365)}.yellow{background:linear-gradient(145deg,#ffe66d,#eabf25)}.music{background:linear-gradient(145deg,#ff7e9b,#d93c70)}.gray{background:linear-gradient(145deg,#aebbc8,#657487)}.blue{background:linear-gradient(145deg,#55c5ff,#1677d7)}.folder{background:linear-gradient(145deg,#71caff,#287fc8)}.heart{background:linear-gradient(145deg,#ff8c9e,#e34566)}.purple{background:linear-gradient(145deg,#8c83ff,#5149d7)}
    .wechat{background:transparent;object-fit:cover;padding:0;overflow:hidden}
    .icon.wechat{display:block;border-radius:21px}
    .dock .icon.wechat{border-radius:18px}.qq{background:linear-gradient(145deg,#54cfff,#1682d8);font-size:36px}.netease{background:linear-gradient(145deg,#ff5555,#d60018);font-size:39px}.safari{background:linear-gradient(145deg,#b9eaff,#4a9be9);font-size:35px}.weather-icon{background:linear-gradient(145deg,#74c9ff,#2e87d9)}
    .page-dots{height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px;font-size:11px;color:#34445d}
    .page-dots button{width:8px;height:8px;border:0;border-radius:50%;padding:0;background:#ffffff9c;cursor:pointer}
    .page-dots button.active{width:19px;border-radius:8px;background:#fff}
    .dock{margin:5px -3px max(8px,env(safe-area-inset-bottom));height:82px;flex-shrink:0;border-radius:29px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:9px 12px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.42);box-shadow:0 8px 28px #44557518;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
    .dock .icon{width:55px;height:55px;border-radius:18px;font-size:28px}
    .home-indicator{position:absolute;bottom:max(5px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:8px;background:#1d243055;z-index:2}
    .app-view{position:absolute;inset:0;background:rgba(246,248,252,.97);z-index:5;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px 28px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
    .app-view.show{display:flex}.app-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 22px}.app-head h2{font-size:27px;margin:0;font-weight:700}.back{border:0;background:#e7ebf2;color:#247bd4;border-radius:20px;padding:9px 14px;font-size:15px}
    .panel{background:white;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #24334b0a}textarea{width:100%;height:42vh;border:0;outline:0;resize:none;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:#202b3c}input,button{font-family:inherit}.action{border:0;border-radius:14px;background:#1684e8;color:white;padding:11px 16px;font-size:15px}.muted{color:#7c8797;font-size:13px}
    .chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{align-self:flex-end;background:#2f9bff;color:white;padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:82%;line-height:1.45}.chat-input{display:flex;gap:8px;margin-top:12px}.chat-input input{flex:1;min-width:0;border:0;background:#fff;border-radius:18px;padding:12px 14px;font-size:15px}
    .wallpapers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.wallpapers button{height:70px;border:2px solid white;border-radius:15px}.photo-preview{width:100%;max-height:45vh;object-fit:contain;border-radius:16px}
    .music-card{text-align:center;margin-top:12px;padding:22px 16px}.music-disc{width:145px;height:145px;border-radius:50%;margin:8px auto 18px;background:radial-gradient(circle,#242424 0 8%,#e8e8e8 9% 12%,#282828 13% 18%,#d51c2a 19% 100%);display:grid;place-items:center;color:#fff;font-size:35px;box-shadow:0 8px 24px #0002}.chat-row{display:flex;align-items:center;gap:12px;background:#fff;padding:12px;border-radius:16px;margin-bottom:10px}.chat-avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#e8f4ff;font-size:23px}

    /* 消消乐 */
    .game-shell{display:flex;flex-direction:column;gap:12px;min-height:0;flex:1;overflow:auto;padding-bottom:8px}
    .game-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .game-stat{background:#fff;border-radius:15px;padding:10px 5px;text-align:center;box-shadow:0 3px 12px #24334b0a}
    .game-stat strong{display:block;font-size:20px;color:#25334a}
    .game-stat span{font-size:11px;color:#8792a2}
    .game-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .game-board{width:min(100%,390px);aspect-ratio:1/1;margin:0 auto;background:linear-gradient(145deg,#dfe9f8,#cbd8ed);padding:7px;border-radius:19px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;flex-shrink:0}
    .game-tile{border:0;border-radius:11px;min-width:0;min-height:0;padding:0;display:grid;place-items:center;font-size:clamp(17px,5.5vw,28px);background:rgba(255,255,255,.86);box-shadow:inset 0 1px 2px #fff,0 2px 4px #52678920;touch-action:manipulation}
    .game-tile.selected{outline:3px solid #397fe8;transform:scale(.91)}
    .game-tile:disabled{opacity:1}
    .game-help{text-align:center;font-size:12px;color:#78869a;line-height:1.5}
    .game-message{min-height:20px;text-align:center;font-size:13px;color:#4774b5;font-weight:600}
    .game-new{border:0;border-radius:13px;background:#347fe0;color:white;padding:10px 12px;font-size:13px;white-space:nowrap}

    @media(min-width:600px){.phone{height:min(92dvh,900px);border-radius:38px;border:8px solid #20232a;box-shadow:0 18px 70px #0008}.island{top:12px}}
  /* 手机屏幕适配 */
@media (max-width: 600px) {
  .phone {
    width: 100vw;
    height: 100dvh;
    max-height: none;
    min-height: 0;
    border-radius: 0;
    border: none;
  }

  .content {
    height: calc(100% - 52px);
    padding: 12px 16px 12px;
  }

  .clock {
    font-size: 58px;
    margin-top: 4px;
  }

  .weather {
    margin-top: 14px;
    height: 110px;
    padding: 13px 18px;
  }

  .page-grid {
    margin-top: 16px;
    row-gap: 13px;
    column-gap: 5px;
  }

  .icon {
    width: clamp(48px, 15vw, 65px);
    height: clamp(48px, 15vw, 65px);
    border-radius: 17px;
  }

  .app-name {
    font-size: 11px;
  }

  .dock {
    height: 70px;
    margin-bottom: 8px;
  }

  .dock .icon {
    width: 49px;
    height: 49px;
  }
}
  /* 锁屏界面 */
.lock-screen {
  position: absolute;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 18vh;
  color: white;
  background: linear-gradient(160deg, #64748b, #1e293b 65%, #0f172a);
}

.lock-time {
  font-size: 76px;
  font-weight: 300;
  letter-spacing: 2px;
}

.lock-date {
  margin-top: 8px;
  font-size: 17px;
}

.lock-box {
  width: 78%;
  margin-top: 100px;
  text-align: center;
}

.lock-box p {
  font-size: 15px;
}

.lock-box input {
  box-sizing: border-box;
  width: 100%;
  height: 48px;
  margin: 15px 0;
  border: 1px solid rgba(255,255,255,.5);
  border-radius: 14px;
  background: rgba(255,255,255,.15);
  color: white;
  text-align: center;
  font-size: 22px;
  letter-spacing: 8px;
  outline: none;
}

.lock-box button {
  width: 100%;
  height: 46px;
  border: none;
  border-radius: 14px;
  background: white;
  color: #263449;
  font-size: 16px;
}

#lockError {
  color: #ffd2d2;
  min-height: 20px;
}
    </style>
    </head>
    <body>
    <main class="phone" id="phone">
      <section id="lockScreen" class="lock-screen">
  <div class="lock-time" id="lockTime">00:00</div>
  <div class="lock-date" id="lockDate">11月1日 星期日</div>

  <div class="lock-box">
    <p>请输入锁屏密码</p>
    <input
      id="lockPassword"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="输入4位密码"
    >
    <button onclick="unlockPhone()">解锁</button>
    <p id="lockError"></p>
  </div>
      </section>
      <div class="status">
          <div class="status-left"><span id="statusTime">09:41</span><span>◔</span></div>
              <div class="status-right"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"><b></b></span><span class="battery"><span></span></span><span>98</span></div>
                </div>
                  <div class="island"></div>
                    <section class="content">
                        <div class="clock" id="bigClock">09:41</div>
                            <div class="date" id="dateText">10月31日 星期六</div>
                                <div class="weather">
                                      <div class="weather-label">天气 · 今天</div>
                                            <div class="weather-row"><div><div class="temp">23°</div><div class="weather-desc">晴朗 · 适合出门</div></div><div class="sun">☀️</div></div>
                                                </div>

                                                    <div class="pages-viewport" id="pagesViewport">
                                                          <div class="pages-track" id="pagesTrack">
                                                                  <div class="page-grid">
                                                                            <button class="app" onclick="openApp('消息')"><span class="icon green">●</span><span class="app-name">信息</span></button>
                                                                                      <button class="app" onclick="openApp('日历')"><span class="icon calendar">📅</span><span class="app-name">日历</span></button>
                                                                                                <button class="app" onclick="openApp('照片')"><span class="icon photos">🌈</span><span class="app-name">照片</span></button>
                                                                                                          <button class="app" onclick="openApp('相机')"><span class="icon camera">📷</span><span class="app-name">相机</span></button>
                                                                                                                    <button class="app" onclick="openApp('手记')"><span class="icon yellow">📝</span><span class="app-name">手记</span></button>
                                                                                                                              <button class="app" onclick="openApp('网易云音乐')"><span class="icon netease">♫</span><span class="app-name">网易云音乐</span></button>
                                                                                                                                        <button class="app" onclick="openApp('时钟')"><span class="icon gray">◷</span><span class="app-name">时钟</span></button>
                                                                                                                                                  <button class="app" onclick="openApp('设置')"><span class="icon gray">⚙</span><span class="app-name">设置</span></button>
                                                                                                                                                            <button class="app" onclick="openApp('邮件')"><span class="icon blue">✉</span><span class="app-name">邮件</span></button>

                                                                                                                                                                                                                                                                                          <button class="app" onclick="openApp('消消乐')"><span class="icon" style="background:linear-gradient(145deg,#ffdf8d,#ff9f72)">🍬</span><span class="app-name">消消乐</span></button>

                                                                                                                                                                                                                                                                                                                                <button class="active" onclick="showPage(0)" aria-label="第一页"></button>

                                                                                                                                                                                                                                                                                                                                                    <button class="app" onclick="openApp('电话')"><span class="icon green">☎</span></button>
                                                                                                                                                                                                                                                                                                                                                          <button class="app" onclick="openApp('微信')"><img src="wechat_original_cropped.png" class="icon wechat" alt="微信"></button>
                                                                                                                                                                                                                                                                                                                                                                <button class="app" onclick="openApp('网易云音乐')"><span class="icon netease">♫</span></button>
                                                                                                                                                                                                                                                                                                                                                                      <button class="app" onclick="openApp('浏览器')"><span class="icon safari">🧭</span></button>

                                                                                                                                                                                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                                                                                                                                                                                          const $ = id => document.getElementById(id);
                                                                                                                                                                                                                                                                                                                                                                                          function updateTime(){
                                                                                                                                                                                                                                                                                                                                                                                            const now=new Date(),time=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
                                                                                                                                                                                                                                                                                                                                                                                              $('statusTime').textContent=time;$('bigClock').textContent=time;
                                                                                                                                                                                                                                                                                                                                                                                                const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
                                                                                                                                                                                                                                                                                                                                                                                                  $('dateText').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                  updateTime();setInterval(updateTime,1000);

                                                                                                                                                                                                                                                                                                                                                                                                  /* 桌面翻页：支持触屏左右滑动，也支持点击下方圆点 */
                                                                                                                                                                                                                                                                                                                                                                                                  let currentPage=0;
                                                                                                                                                                                                                                                                                                                                                                                                  function showPage(page){
                                                                                                                                                                                                                                                                                                                                                                                                    currentPage=Math.max(0,Math.min(1,page));
                                                                                                                                                                                                                                                                                                                                                                                                      $('pagesTrack').style.transform=`translateX(-${currentPage*50}%)`;
                                                                                                                                                                                                                                                                                                                                                                                                        [...$('pageDots').children].forEach((dot,index)=>dot.classList.toggle('active',index===currentPage));
                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                        (function enablePageSwipe(){
                                                                                                                                                                                                                                                                                                                                                                                                          const area=$('pagesViewport');let startX=0,startY=0,tracking=false;
                                                                                                                                                                                                                                                                                                                                                                                                            area.addEventListener('touchstart',event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                startX=event.touches[0].clientX;startY=event.touches[0].clientY;tracking=true;
                                                                                                                                                                                                                                                                                                                                                                                                                  },{passive:true});
                                                                                                                                                                                                                                                                                                                                                                                                                    area.addEventListener('touchend',event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                        if(!tracking)return;tracking=false;
                                                                                                                                                                                                                                                                                                                                                                                                                            const dx=event.changedTouches[0].clientX-startX;
                                                                                                                                                                                                                                                                                                                                                                                                                                const dy=event.changedTouches[0].clientY-startY;
                                                                                                                                                                                                                                                                                                                                                                                                                                    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))showPage(currentPage+(dx<0?1:-1));
                                                                                                                                                                                                                                                                                                                                                                                                                                      },{passive:true});
                                                                                                                                                                                                                                                                                                                                                                                                                                        let mouseStart=0;
                                                                                                                                                                                                                                                                                                                                                                                                                                          area.addEventListener('mousedown',event=>{mouseStart=event.clientX});
                                                                                                                                                                                                                                                                                                                                                                                                                                            area.addEventListener('mouseup',event=>{const dx=event.clientX-mouseStart;if(Math.abs(dx)>45)showPage(currentPage+(dx<0?1:-1))});
                                                                                                                                                                                                                                                                                                                                                                                                                                            })();

                                                                                                                                                                                                                                                                                                                                                                                                                                            function openApp(name){
                                                                                                                                                                                                                                                                                                                                                                                                                                              $('appTitle').textContent=name;$('appView').classList.add('show');
                                                                                                                                                                                                                                                                                                                                                                                                                                                const body=$('appBody');
                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(name==='手记'||name==='备忘录'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                      body.innerHTML=`<div class="panel"><div class="muted">自动保存在这台设备</div><textarea id="noteText" placeholder="记录一点今天的想法……"></textarea></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('noteText').value=localStorage.getItem('myPhoneNote')||'';
                                                                                                                                                                                                                                                                                                                                                                                                                                                              $('noteText').addEventListener('input',event=>localStorage.setItem('myPhoneNote',event.target.value));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }else if(name==='网易云音乐'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    body.innerHTML=`<div class="panel music-card"><div class="music-disc">♫</div><h2 id="trackName">网易云音乐 · 本地试听</h2><p class="muted" id="trackInfo">选择平板里的音频文件播放</p><input type="file" id="audioFile" accept="audio/*" style="max-width:100%;margin:12px auto"><audio id="audioPlayer" controls style="width:100%;margin-top:12px"></audio><p class="muted">这是仿网易云风格的本地播放器，不连接真实网易云账号或在线曲库。</p></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        $('audioFile').onchange=event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const file=event.target.files[0];if(!file)return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $('trackName').textContent=file.name.replace(/\.[^.]+$/,'');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('trackInfo').textContent='已载入本地音频';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                $('audioPlayer').src=URL.createObjectURL(file);$('audioPlayer').play().catch(()=>{});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }else if(name==='微信'||name==='QQ'||name==='消息'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const chatName=name==='微信'?'文件传输助手':name==='QQ'?'我的好友':'信息演示';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              body.innerHTML=`<div class="panel"><strong>${name} · 模拟聊天</strong><p class="muted">这里是演示界面，消息只保存在当前页面，不会发送到真实账号。</p></div><div class="chat-row"><div class="chat-avatar">${name==='QQ'?'🐧':'💬'}</div><div><strong>${chatName}</strong><div class="muted">点击下方输入框发送一条消息</div></div></div><div class="chatlog" id="chatLog"><div class="bubble" style="align-self:flex-start;background:#fff;color:#222">你好！欢迎来到${name}。</div></div><div class="chat-input"><input id="chatInput" placeholder="输入消息……"><button class="action" id="sendBtn">发送</button></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const send=()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const value=$('chatInput').value.trim();if(!value)return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $('chatLog').appendChild(bubble);$('chatInput').value='';$('chatLog').scrollTop=$('chatLog').scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $('sendBtn').onclick=send;$('chatInput').addEventListener('keydown',event=>{if(event.key==='Enter')send()});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }else if(name==='日历'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const now=new Date();body.innerHTML=`<div class="panel"><h2>${now.getFullYear()}年${now.getMonth()+1}月</h2><p>今天是 ${now.getDate()} 日</p><p class="muted">把重要的日子记在这里吧。</p></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }else if(name==='照片'||name==='相机'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        body.innerHTML=`<div class="panel"><h3>选择一张照片进行预览</h3><input type="file" accept="image/*" id="photoInput"><div id="photoArea" style="margin-top:14px"></div></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $('photoInput').onchange=event=>{const file=event.target.files[0];if(!file)return;const image=document.createElement('img');image.className='photo-preview';image.src=URL.createObjectURL(file);$('photoArea').replaceChildren(image)};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }else if(name==='消消乐'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  renderMatchGame(body);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }else if(name==='设置'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        body.innerHTML=`<div class="panel"><h3>外观与壁纸</h3><p class="muted">选择一款预设壁纸，或上传自己的照片。</p><div class="wallpapers"><button style="background:linear-gradient(135deg,#86afe5,#e8d9e9)" onclick="setWall(0)"></button><button style="background:linear-gradient(135deg,#f3a9c5,#d6b5e9)" onclick="setWall(1)"></button><button style="background:linear-gradient(135deg,#8bd6c0,#d9edc9)" onclick="setWall(2)"></button><button style="background:linear-gradient(135deg,#8e9ce7,#c4b9ef)" onclick="setWall(3)"></button></div><div style="margin-top:18px"><label class="action" for="wallpaperInput" style="display:inline-block;cursor:pointer">从相册选择壁纸</label><input id="wallpaperInput" type="file" accept="image/*" style="display:none"><button class="back" style="margin-left:8px" onclick="resetWall()">恢复默认</button><p class="muted" id="wallpaperHint">上传的图片会保存在当前浏览器中。</p></div></div><div class="panel"><h3>关于本机</h3><p class="muted">我的小手机 · 网页体验版</p></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $('wallpaperInput').onchange=handleWallpaperUpload;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }else{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  body.innerHTML=`<div class="panel"><div style="font-size:48px;text-align:center;margin:20px">✨</div><h3 style="text-align:center">${name}</h3><p class="muted" style="text-align:center">这是 ${name} 的演示页面，更多功能可以继续添加。</p></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function renderMatchGame(body){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      body.innerHTML=`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="game-shell">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="game-stats">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="game-stat"><strong id="gameScore">0</strong><span>当前分数</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="game-stat"><strong id="gameMoves">25</strong><span>剩余步数</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="game-stat"><strong>500</strong><span>目标分数</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="game-toolbar"><span class="muted">交换相邻糖果，连成三个即可消除</span><button class="game-new" id="gameRestart">重新开始</button></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="game-board" id="gameBoard"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="game-message" id="gameMessage">选择一个糖果，再选择旁边的糖果交换</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="game-help">横向或纵向连成三个及以上相同图案即可得分。达到 500 分获胜！</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const symbols=['🍓','🍋','🍇','🍊','🍏','🍬'];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const size=8,target=500;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let board=[],score=0,moves=25,selected=-1,busy=false,ended=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const boardEl=$('gameBoard'),scoreEl=$('gameScore'),movesEl=$('gameMoves'),messageEl=$('gameMessage');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const randomCandy=()=>Math.floor(Math.random()*symbols.length);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const cell=(r,c)=>r*size+c;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function findMatches(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const found=new Set();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                for(let r=0;r<size;r++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for(let c=0;c<size;c++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const kind=board[cell(r,c)];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let row=[cell(r,c)],col=[cell(r,c)];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              for(let x=c-1;x>=0&&board[cell(r,x)]===kind;x--)row.push(cell(r,x));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for(let x=c+1;x<size&&board[cell(r,x)]===kind;x++)row.push(cell(r,x));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              for(let y=r-1;y>=0&&board[cell(y,c)]===kind;y--)col.push(cell(y,c));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for(let y=r+1;y<size&&board[cell(y,c)]===kind;y++)col.push(cell(y,c));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(row.length>=3)row.forEach(i=>found.add(i));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(col.length>=3)col.forEach(i=>found.add(i));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return [...found];
