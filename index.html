<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ededed">
<title>微信 · 小手机</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#191919}button,input{font:inherit}button{cursor:pointer}.phone{height:100dvh;width:min(100vw,480px);margin:auto;background:#ededed;display:flex;flex-direction:column;position:relative;overflow:hidden}.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#ededed;flex-shrink:0}.bar h1{font-size:18px;margin:0;font-weight:600}.bar button{border:0;background:none;font-size:23px;padding:4px 8px}.view{display:none;flex:1;min-height:0;flex-direction:column}.view.active{display:flex}.search{margin:8px 12px;background:#e2e2e2;border-radius:7px;text-align:center;padding:8px;color:#888;font-size:14px}.list{overflow:auto;flex:1;background:#fff}.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #f2f2f2;min-height:72px;background:#fff;text-align:left;width:100%;border-radius:0;color:#222}.avatar{width:48px;height:48px;border-radius:6px;background:#dce9e1;display:grid;place-items:center;object-fit:cover;flex-shrink:0;font-size:24px}.row-main{min-width:0;flex:1}.row-title{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:13px;color:#999;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{height:56px;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;background:#f7f7f7;border-top:1px solid #ddd;flex-shrink:0}.tabs button{border:0;background:none;color:#777;font-size:11px;flex:1}.tabs button b{display:block;font-size:21px;font-weight:400;margin-bottom:2px}.tabs button.on{color:#07c160}.empty{color:#aaa;text-align:center;padding:55px 20px;font-size:14px}.green{color:#07c160}.chathead{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#ededed;border-bottom:1px solid #ddd;flex-shrink:0;position:relative}.chathead .center{position:absolute;left:50%;transform:translateX(-50%);max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:17px}.chathead button{border:0;background:none;font-size:20px;padding:5px 8px}.chathead #chatMenu{font-size:13px;letter-spacing:3px;padding:8px 2px}.messages{flex:1;overflow:auto;padding:14px 10px 18px;display:flex;flex-direction:column;gap:13px;background:#ededed}.stamp{text-align:center;color:#aaa;font-size:11px;margin:7px 0}.msg{display:flex;gap:8px;align-items:flex-start;max-width:88%}.msg.mine{align-self:flex-end;flex-direction:row-reverse}.msg .avatar{width:40px;height:40px;border-radius:5px}.bubble{position:relative;background:#fff;border-radius:4px;padding:10px 12px;font-size:16px;line-height:1.45;overflow-wrap:anywhere;max-width:calc(100vw - 120px);box-shadow:0 1px 1px #00000008}.msg:not(.mine) .bubble:before{content:"";position:absolute;left:-5px;top:13px;border-width:5px 6px 5px 0;border-style:solid;border-color:transparent #fff transparent transparent}.msg.mine .bubble{background:#95ec69}.msg.mine .bubble:after{content:"";position:absolute;right:-5px;top:13px;border-width:5px 0 5px 6px;border-style:solid;border-color:transparent transparent transparent #95ec69}.composer{display:flex;align-items:center;gap:8px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#f7f7f7;border-top:1px solid #ddd;flex-shrink:0}.emoji-panel{background:#f0f0f0;border-top:1px solid #ddd;max-height:48%;display:flex;flex-direction:column}.emoji-tabs{display:flex;gap:18px;overflow-x:auto;padding:12px 14px;background:#f7f7f7;white-space:nowrap}.emoji-tabs button{border:0;background:transparent;font-size:23px;min-width:34px}.emoji-tabs button.on{background:white;border-radius:10px;padding:5px}.emoji-grid{overflow:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:12px}.emoji-grid button{border:0;background:transparent;font-size:28px;min-height:42px}.emoji-label{padding:10px 14px;color:#777;font-size:13px}.chat-sticker{max-width:130px;max-height:130px;object-fit:contain;display:block}.group-sender-name{font-size:12px;color:#888;margin:0 0 4px 2px}.msg.mine .group-sender-name{text-align:right}.composer button{border:0;background:transparent;font-size:23px;padding:4px}.composer input{flex:1;min-width:0;border:0;border-radius:5px;background:#fff;padding:10px;font-size:16px;outline:none}.send{background:#07c160!important;color:#fff!important;border-radius:5px!important;font-size:14px!important;padding:8px 12px!important}.modal{position:absolute;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:100%;max-height:86%;overflow:auto;background:#f7f7f7;border-radius:17px 17px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 14px;font-size:18px}.field{display:block;margin:12px 0;font-size:13px;color:#666}.field input,.field textarea{display:block;width:100%;border:1px solid #ddd;border-radius:8px;background:white;padding:11px;margin-top:6px;font-size:15px;outline:none}.btns{display:flex;gap:10px;margin-top:16px}.btns button{flex:1;border:0;border-radius:8px;padding:12px;background:#e5e5e5}.btns .primary{background:#07c160;color:white}.personpick{display:flex;align-items:center;gap:10px;padding:9px 0}.personpick input{width:18px;height:18px}.small{font-size:12px;color:#999}.avatar-edit{display:flex;align-items:center;gap:14px}.avatar-edit .avatar{width:62px;height:62px}.more{font-size:14px!important}.hidden{display:none!important}
</style></head>
<body><main class="phone">

<header class="bar" id="mainbar"><h1 id="barTitle">微信</h1><div><button id="addBtn" aria-label="添加">＋</button></div></header>
<section class="view active" id="chatsView"><div class="search">⌕　搜索</div><div class="list" id="chatList"></div></section>
<section class="view" id="contactsView"><div class="list" id="contactList"></div></section>
<section class="view" id="meView"><div style="padding:22px 16px;background:white;display:flex;align-items:center;gap:14px" id="myProfile"></div><div class="list" style="margin-top:12px"><button class="row" id="managePeople"><span class="avatar">👥</span><span class="row-main">人物管理</span><span>›</span></button><button class="row" id="createGroup"><span class="avatar">💬</span><span class="row-main">发起群聊</span><span>›</span></button><button class="row" id="backupData"><span class="avatar">📦</span><span class="row-main">数据备份与恢复<div class="small">导出或导入人物、头像和聊天记录</div></span><span>›</span></button></div></section>
<nav class="tabs" id="tabs"><button class="on" data-view="chatsView"><b>▣</b>微信</button><button data-view="contactsView"><b>♙</b>通讯录</button><button data-view="meView"><b>◉</b>我</button></nav>
<section class="view" id="chatView"><div class="chathead"><button id="backBtn">‹</button><div class="center" id="chatTitle">聊天</div><button id="chatMenu">···</button></div><div class="messages" id="messages"></div><div class="composer"><button id="switchSender" title="切换发送身份">⇄</button><input id="messageInput" placeholder="发送消息…" autocomplete="off"><button id="emojiBtn">☺</button><button class="send" id="sendBtn">发送</button></div><div class="emoji-panel hidden" id="emojiPanel"><div class="emoji-tabs" id="emojiTabs"></div><div class="emoji-label" id="emojiLabel">最近使用</div><div class="emoji-grid" id="emojiGrid"></div><div style="padding:8px 12px"><label class="small">添加自己的表情包（GIF / PNG / JPG）<input id="stickerUpload" type="file" accept="image/*" multiple style="display:block;margin-top:6px"></label></div></div></section>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
</main>
<script>
const $=id=>document.getElementById(id), KEY='wx_simulator_v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{people:[],chats:[],meId:null}}catch(e){db={people:[],chats:[],meId:null}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const person=id=>db.people.find(p=>p.id===id);
const activeChat=()=>db.chats.find(c=>c.id===currentChat);
let currentChat=null,currentView='chatsView',senderId=null;
function avatar(p){return p?.avatar?'<img class="avatar" src="'+p.avatar+'">':'<span class="avatar">'+(p?.emoji||'🙂')+'</span>'}
const emojiSets=[{name:'最近使用',icon:'◷',items:[]},{name:'笑脸',icon:'☺',items:Array.from('😀 😃 😄 😁 😆 😅 😂 🤣 🥲 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😋 😛 😜 🤪 😝 🤗 🤭 🫢 🫣 🤫 🤔 😐 😑 😶 😏 😒 🙄 😬 😔 😪 😴 😷 🤒 🤢 🤮 🥵 🥶 🥴 😵 🤯 🥳 😎 🤓 🧐 😕 😟 🙁 ☹️ 😮 😯 😲 😳 🥺 🥹 😨 😰 😢 😭 😱 😖 😞 😩 😫 🥱 😤 😡 😠 🤬 😈 💀 💩 🤡 👻 👽 🤖'.split(' '))},{name:'手势',icon:'👍',items:Array.from('👋 🤚 🖐️ ✋ 👌 🤌 🤏 ✌️ 🤞 🫰 🤟 🤘 🤙 👈 👉 👆 🖕 👇 ☝️ 👍 👎 ✊ 👊 👏 🙌 👐 🤲 🤝 🙏 💪'.split(' '))},{name:'爱心',icon:'❤️',items:Array.from('❤️ 🩷 🧡 💛 💚 💙 🩵 💜 🤎 🖤 🤍 💔 💕 💞 💓 💗 💖 💘 💝 💟'.split(' '))},{name:'动物',icon:'🐱',items:Array.from('🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐔 🐧 🐦 🦄 🐝 🦋 🐢 🐙 🦀 🐬 🐳 🦖'.split(' '))},{name:'食物',icon:'🍎',items:Array.from('🍏 🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥝 🍅 🥑 🍆 🥔 🥕 🌽 🌶️ 🥒 🥬 🥦 🍞 🥐 🧀 🍔 🍟 🍕 🍿 🍩 🍪 🎂 🍰 ☕ 🍵 🧋'.split(' '))},{name:'其他',icon:'🎉',items:Array.from('🌈 ☀️ ⭐ 🌙 ⚡ 🔥 💧 🌸 🌹 🌻 🍀 🎉 🎊 🎁 🎈 🏆 ⚽ 🎮 🚗 ✈️ 🏠 📱 💻 📷 💡 💰 💎'.split(' '))},{name:'我的收藏',icon:'⭐',items:[]}];
let recentEmojis=JSON.parse(localStorage.getItem('wx_recent_emoji')||'[]');
let myStickers=JSON.parse(localStorage.getItem('wx_my_stickers')||'[]');
function renderEmojiTab(index=0){const set=emojiSets[index];$('emojiLabel').textContent=set.name;const items=index===0?recentEmojis:index===7?myStickers:set.items;$('emojiGrid').innerHTML=items.map((e,i)=>index===7?'<button type="button" data-sticker="'+i+'"><img src="'+e.data+'" style="width:48px;height:48px;object-fit:contain"><small>×</small></button>':'<button type="button" data-emoji="'+e+'">'+e+'</button>').join('')||'<div class="small" style="grid-column:1/-1;padding:18px">这里还没有内容</div>';$('emojiGrid').querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{const input=$('messageInput');input.value+=b.dataset.emoji;input.focus();recentEmojis=[b.dataset.emoji,...recentEmojis.filter(x=>x!==b.dataset.emoji)].slice(0,24);localStorage.setItem('wx_recent_emoji',JSON.stringify(recentEmojis))});$('emojiGrid').querySelectorAll('[data-sticker]').forEach(b=>b.onclick=()=>sendFavoriteSticker(Number(b.dataset.sticker)));$('emojiTabs').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===index))}
function sendFavoriteSticker(i){const c=activeChat(),st=myStickers[i];if(!c||!st)return;c.messages.push({id:crypto.randomUUID(),sender:senderId||c.viewAs||c.personIds[0],type:'sticker',data:st.data,time:new Date().toLocaleTimeString()});save();renderMessages()}
function toggleEmojiPanel(){const p=$('emojiPanel');p.classList.toggle('hidden');if(!p.classList.contains('hidden')){if(!$('emojiTabs').children.length){$('emojiTabs').innerHTML=emojiSets.map(x=>'<button type="button" title="'+x.name+'">'+x.icon+'</button>').join('');$('emojiTabs').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>renderEmojiTab(i))}renderEmojiTab(0)}}
$('stickerUpload').onchange=e=>{[...e.target.files].forEach(file=>{if(!file.type.startsWith('image/'))return;if(file.size>2*1024*1024){alert(file.name+' 超过2MB，请压缩后上传');return}const reader=new FileReader();reader.onload=()=>{myStickers.push({name:file.name,data:reader.result});try{localStorage.setItem('wx_my_stickers',JSON.stringify(myStickers));if($('emojiTabs').children.length)renderEmojiTab(7)}catch(err){myStickers.pop();alert('收藏失败：浏览器存储空间可能不足，请换用较小的图片')}};reader.readAsDataURL(file)});e.target.value=''};
function showView(id){currentView=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));$('tabs').classList.toggle('hidden',id==='chatView');$('mainbar').classList.toggle('hidden',id==='chatView');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===id));if(id==='chatsView')renderChats();if(id==='contactsView')renderContacts();if(id==='meView')renderMe()}
function openModal(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function renderChats(){const box=$('chatList');if(!db.chats.length){box.innerHTML='<div class="empty">还没有聊天<br><br>点击右上角 ＋ 添加人物或创建群聊</div>';return}box.innerHTML=db.chats.map(c=>{const last=c.messages.at(-1);const title=c.type==='group'?c.name:(person(c.personIds.find(id=>id!==db.meId))?.name||'聊天');const p=person(c.personIds.find(id=>id!==db.meId));return '<button class="row" data-chat="'+c.id+'">'+(c.type==='group'?'<span class="avatar">👥</span>':avatar(p))+'<span class="row-main"><span class="row-title">'+esc(title)+'</span><span class="row-sub">'+esc(last?.text||'暂无消息')+'</span></span><span class="small">'+(last?last.time:'')+'</span></button>'}).join('');box.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat))}
function renderContacts(){const box=$('contactList');if(!db.people.length){box.innerHTML='<div class="empty">还没有人物，点击右上角 ＋ 添加</div>';return}box.innerHTML=db.people.map(p=>'<button class="row" data-person="'+p.id+'">'+avatar(p)+'<span class="row-main"><span class="row-title">'+esc(p.name)+'</span><span class="row-sub">'+(p.id===db.meId?'我方身份':'联系人')+'</span></span></button>').join('');box.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>personMenu(b.dataset.person))}
function renderMe(){const p=person(db.meId);$('myProfile').innerHTML=(p?avatar(p):'<span class="avatar">🙂</span>')+'<div><b>'+(p?esc(p.name):'尚未设置我方身份')+'</b><div class="small" style="margin-top:6px">当前聊天发送身份</div></div><button style="margin-left:auto;border:0;background:none" id="chooseMe">切换 ›</button>';$('chooseMe').onclick=chooseMe}

function backupData(){openModal('<h3>数据备份与恢复</h3><p class="small">备份包含人物资料、头像、单聊群聊和聊天记录。表情最近使用记录也会一起备份。</p><div class="btns"><button class="primary" id="exportBackup">导出备份文件</button><button id="importBackup">导入备份文件</button></div><p class="small" style="margin-top:12px">导入会替换当前浏览器中的人物和聊天数据，建议先导出一份当前备份。</p><div class="btns"><button onclick="closeModal()">关闭</button></div><input id="backupFile" type="file" accept=".json,application/json" class="hidden">');$('exportBackup').onclick=()=>{try{const payload={app:'wx_simulator',version:1,createdAt:new Date().toISOString(),db,recentEmojis:JSON.parse(localStorage.getItem('wx_recent_emoji')||'[]')};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='微信模拟器备份_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}catch(e){alert('导出失败：'+e.message)}};$('importBackup').onclick=()=>$('backupFile').click();$('backupFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const next=data.db||data;if(!next||!Array.isArray(next.people)||!Array.isArray(next.chats))throw new Error('备份文件格式不正确');if(!confirm('导入将替换当前浏览器中的人物和聊天记录，确定继续吗？'))return;db={people:next.people,chats:next.chats,meId:next.meId||null};save();localStorage.setItem('wx_recent_emoji',JSON.stringify(Array.isArray(data.recentEmojis)?data.recentEmojis:[]));closeModal();renderChats();renderContacts();renderMe();alert('备份恢复成功！')}catch(err){alert('恢复失败：'+err.message)}finally{e.target.value=''}};reader.readAsText(file)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addPerson(){openModal('<h3>添加人物</h3><label class="field">人物昵称<input id="pname" maxlength="24" placeholder="输入昵称"></label><div class="avatar-edit"><span class="avatar" id="avatarPreview">🙂</span><label class="field" style="flex:1">头像（可选）<input id="pavatar" type="file" accept="image/*"></label></div><div class="btns"><button onclick="closeModal()">取消</button><button class="primary" id="savePerson">保存人物</button></div>');let data='';$('pavatar').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024){alert('头像请选3MB以内的图片');return}const r=new FileReader();r.onload=()=>{data=r.result;$('avatarPreview').innerHTML='<img class="avatar" src="'+data+'">'};r.readAsDataURL(f)};$('savePerson').onclick=()=>{const name=$('pname').value.trim();if(!name){alert('请填写昵称');return}const p={id:crypto.randomUUID(),name,avatar:data,emoji:'🙂'};db.people.push(p);if(!db.meId)db.meId=p.id;save();closeModal();renderContacts();renderMe()}}
function chooseMe(){if(!db.people.length){addPerson();return}openModal('<h3>选择我方身份</h3>'+db.people.map(p=>'<label class="personpick">'+avatar(p)+'<span style="flex:1">'+esc(p.name)+'</span><input type="radio" name="me" value="'+p.id+'" '+(p.id===db.meId?'checked':'')+'></label>').join('')+'<div class="btns"><button onclick="closeModal()">取消</button><button class="primary" id="confirmMe">确定</button></div>');$('confirmMe').onclick=()=>{db.meId=document.querySelector('input[name=me]:checked')?.value||db.meId;save();closeModal();renderMe()}}
function personMenu(id){const p=person(id);openModal('<h3>'+esc(p.name)+'</h3><div class="btns"><button id="editPerson">编辑资料</button><button class="primary" id="startChat">发消息</button></div><div class="btns"><button id="setMe">设为我方</button><button id="deletePerson">删除人物</button></div><div class="btns"><button onclick="closeModal()">关闭</button></div>');$('startChat').onclick=()=>{closeModal();let c=db.chats.find(c=>c.type==='single'&&c.personIds.includes(id)&&c.personIds.includes(db.meId));if(!c){c={id:crypto.randomUUID(),type:'single',personIds:[db.meId,id],messages:[]};db.chats.push(c);save()}openChat(c.id)};$('setMe').onclick=()=>{db.meId=id;save();closeModal();renderMe()};$('deletePerson').onclick=()=>{if(!confirm('删除这个人物？相关聊天记录也会被删除。'))return;db.people=db.people.filter(x=>x.id!==id);db.chats=db.chats.filter(c=>!c.personIds.includes(id));if(db.meId===id)db.meId=db.people[0]?.id||null;save();closeModal();renderContacts()};$('editPerson').onclick=()=>editPerson(id)}
function editPerson(id){const p=person(id);openModal('<h3>编辑人物</h3><label class="field">昵称<input id="editName" value="'+esc(p.name)+'"></label><div class="avatar-edit">'+avatar(p)+'<label class="field" style="flex:1">更换头像<input id="editAvatar" type="file" accept="image/*"></label></div><div class="btns"><button onclick="closeModal()">取消</button><button class="primary" id="saveEdit">保存</button></div>');let data=p.avatar;$('editAvatar').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>data=r.result;r.readAsDataURL(f)};$('saveEdit').onclick=()=>{p.name=$('editName').value.trim()||p.name;p.avatar=data;save();closeModal();renderContacts()}}
function newSingleChat(){if(db.people.length<2){alert('请先添加至少两个人物');return}openModal('<h3>选择单聊双方</h3>'+db.people.map(p=>'<label class="personpick">'+avatar(p)+'<span style="flex:1">'+esc(p.name)+'</span><input type="checkbox" name="singlePair" value="'+p.id+'"></label>').join('')+'<div class="btns"><button onclick="closeModal()">取消</button><button class="primary" id="createSinglePair">创建单聊</button></div>');$('createSinglePair').onclick=()=>{const ids=[...document.querySelectorAll('input[name="singlePair"]:checked')].map(x=>x.value);if(ids.length!==2){alert('单聊请准确选择两个人物');return}let c=db.chats.find(c=>c.type==='single'&&c.personIds.length===2&&ids.every(id=>c.personIds.includes(id)));if(!c){c={id:crypto.randomUUID(),type:'single',personIds:ids,messages:[],viewAs:db.meId&&ids.includes(db.meId)?db.meId:ids[0]};db.chats.push(c);save()}closeModal();openChat(c.id)}}
function createGroup(){if(db.people.length<2){alert('请先添加至少两个人物，再创建群聊');return}openModal('<h3>创建群聊</h3><label class="field">群聊名称<input id="groupName" placeholder="给群聊起个名字"></label><p class="small">选择群成员（可多选）</p>'+db.people.map(p=>'<label class="personpick">'+avatar(p)+'<span style="flex:1">'+esc(p.name)+'</span><input type="checkbox" name="members" value="'+p.id+'" '+(p.id===db.meId?'checked':'')+'></label>').join('')+'<div class="btns"><button onclick="closeModal()">取消</button><button class="primary" id="makeGroup">创建群聊</button></div>');$('makeGroup').onclick=()=>{const ids=[...document.querySelectorAll('input[name=members]:checked')].map(x=>x.value);if(ids.length<2){alert('群聊至少选择两个人物');return}const c={id:crypto.randomUUID(),type:'group',name:$('groupName').value.trim()||'群聊',personIds:ids,messages:[]};db.chats.push(c);save();closeModal();openChat(c.id)}}
function openChat(id){currentChat=id;const c=activeChat();if(!c)return;c.viewAs=c.viewAs&&c.personIds.includes(c.viewAs)?c.viewAs:(c.personIds.includes(db.meId)?db.meId:c.personIds[0]);senderId=c.viewAs;$('chatTitle').textContent=c.type==='group'?c.name:(c.personIds.filter(x=>x!==c.viewAs).map(x=>person(x)?.name).filter(Boolean).join('、')||'聊天');showView('chatView');renderMessages()}
function renderMessages(){const c=activeChat();if(!c)return;const box=$('messages');box.innerHTML=c.messages.length?c.messages.map(m=>{const p=person(m.sender);if(m.type==='time')return '<div class="stamp">'+esc(m.text)+'</div>';const mine=m.sender===c.viewAs;const content=m.type==='sticker'?'<img class="chat-sticker" src="'+m.data+'" alt="表情包">':esc(m.text||'');return '<div class="msg '+(mine?'mine':'')+'">'+avatar(p)+'<div>'+(c.type==='group'?'<div class="group-sender-name">'+esc(p?.name||'未知人物')+'</div>':'')+'<div class="'+(m.type==='sticker'?'':'bubble')+'">'+content+'</div></div></div>'}).join(''):'<div class="empty">聊天记录为空<br>发送第一条消息吧</div>';box.scrollTop=box.scrollHeight;$('switchSender').title='当前发送：'+(person(senderId)?.name||'未选择')}
function sendMessage(){const text=$('messageInput').value.trim();if(!text)return;$('emojiPanel').classList.add('hidden');const c=activeChat();if(!c)return;if(!senderId||!c.personIds.includes(senderId)){senderId=db.meId||c.personIds[0]}c.messages.push({id:crypto.randomUUID(),sender:senderId,text,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),type:'text'});save();$('messageInput').value='';renderMessages()}
function switchSender(){const c=activeChat();if(!c||c.personIds.length<2)return;if(c.type==='group'){openModal('<h3>选择群聊发送者</h3>'+c.personIds.map(id=>{const p=person(id);return '<label class="personpick">'+avatar(p)+'<span style="flex:1">'+esc(p?.name||'未知人物')+'</span><input type="radio" name="sender" value="'+id+'" '+(id===senderId?'checked':'')+'></label>'}).join('')+'<div class="btns"><button onclick="closeModal()">取消</button><button class="primary" id="chooseGroupSender">确定</button></div>');$('chooseGroupSender').onclick=()=>{senderId=document.querySelector('input[name="sender"]:checked')?.value||senderId;closeModal();$('switchSender').title='当前发送：'+person(senderId)?.name};return}const k=c.personIds.indexOf(senderId);senderId=c.personIds[(k+1)%c.personIds.length];$('switchSender').title='当前发送：'+(person(senderId)?.name||'未知人物');$('switchSender').style.color='#07c160'}
function openChatCapture(){const c=activeChat();if(!c)return;if(!c.messages.length){alert('当前聊天还没有消息');return}const rows=c.messages.map((m,i)=>'<label class="capture-row" style="display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid #eee"><input type="checkbox" class="capture-check" value="'+i+'" checked style="width:22px;height:22px"><span style="width:42px;height:42px;flex:none">'+(m.sender?avatar(person(m.sender)):'')+'</span><span style="flex:1;min-width:0;overflow-wrap:anywhere">'+esc(m.type==='sticker'?'[表情包]':m.text||'[消息]')+'</span></label>').join('');openModal('<h3>选择要截图的消息</h3><p class="small">像微信一样勾选需要保留的聊天记录，也可以全选或取消全选。</p><div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0"><label><input type="checkbox" id="captureAll" checked> 全选</label><span class="small" id="captureCount">已选择 '+c.messages.length+' 条</span></div><div id="captureRows" style="max-height:55vh;overflow:auto;background:#f5f5f5;border-radius:12px">'+rows+'</div><div class="btns" style="margin-top:14px"><button onclick="closeModal()">取消</button><button class="primary" id="makeCapture">生成图片</button></div>');const checks=[...document.querySelectorAll('.capture-check')];$('captureAll').onchange=()=>{checks.forEach(x=>x.checked=$('captureAll').checked);updateCaptureCount()};checks.forEach(x=>x.onchange=()=>{ $('captureAll').checked=checks.every(v=>v.checked);updateCaptureCount()});function updateCaptureCount(){$('captureCount').textContent='已选择 '+checks.filter(x=>x.checked).length+' 条'}$('makeCapture').onclick=()=>{const ids=checks.filter(x=>x.checked).map(x=>Number(x.value));if(!ids.length){alert('请至少选择一条消息');return}exportChatCapture(c,ids)}}
async function exportChatCapture(c,ids){const list=ids.map(i=>c.messages[i]).filter(Boolean);const width=900,pad=36,gap=24,lineH=34,bubbleMax=620;const measure=document.createElement('canvas').getContext('2d');measure.font='26px Arial,sans-serif';const wrap=(text,max)=>{const out=[];let line='';for(const ch of String(text||'')){if(measure.measureText(line+ch).width>max&&line){out.push(line);line=ch}else line+=ch}out.push(line);return out};const prepared=list.map(m=>{const p=person(m.sender);const txt=m.type==='sticker'?'[表情包]':m.text||'';const lines=wrap(txt,bubbleMax-36);return {m,p,lines,h:Math.max(68,lines.length*lineH+34)}});const height=pad*2+prepared.reduce((n,x)=>n+x.h+gap,0)+40;if(height>16000){alert('所选内容太长，请缩小截图范围');return}const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.fillStyle='#f4f4f4';ctx.fillRect(0,0,width,height);ctx.fillStyle='#888';ctx.font='20px Arial';ctx.textAlign='center';ctx.fillText(c.name||'聊天记录',width/2,42);let y=86;for(const item of prepared){const mine=item.m.sender===c.viewAs;const x=mine?width-pad-bubbleMax:pad+74;const bw=Math.min(bubbleMax,Math.max(120,...item.lines.map(t=>measure.measureText(t).width+36)));const bx=mine?width-pad-bw:pad+74;ctx.fillStyle=mine?'#95ec69':'#fff';ctx.beginPath();ctx.roundRect(bx,y,bw,item.h,12);ctx.fill();ctx.fillStyle='#222';ctx.font='26px Arial,sans-serif';ctx.textAlign='left';if(item.m.type==='sticker'&&item.m.data){try{const im=new Image();im.src=item.m.data;await new Promise((res,rej)=>{im.onload=res;im.onerror=rej});ctx.drawImage(im,bx+12,y+10,Math.min(240,im.width),Math.min(180,im.height))}catch(e){ctx.fillText('[图片表情]',bx+18,y+42)}}else item.lines.forEach((line,i)=>ctx.fillText(line,bx+18,y+40+i*lineH));ctx.fillStyle='#999';ctx.font='17px Arial';ctx.textAlign=mine?'right':'left';ctx.fillText(item.p?.name||'未知人物',mine?width-pad:pad+74,y-7);y+=item.h+gap}const a=document.createElement('a');a.download='聊天记录截图_'+new Date().toISOString().slice(0,10)+'.png';a.href=canvas.toDataURL('image/png');a.click();closeModal()}
function swapPerspective(){const c=activeChat();if(!c||c.personIds.length<2)return;const i=c.personIds.indexOf(c.viewAs);c.viewAs=c.personIds[(i+1)%c.personIds.length];senderId=c.viewAs;save();renderMessages();$('switchSender').title='当前发送：'+(person(senderId)?.name||'未知人物')}
function chatMenu(){openModal('<h3>聊天设置</h3><div class="btns"><button class="primary" id="openChatCapture">📷 截取聊天记录</button></div><div class="btns"><button id="swapView">切换双方视角</button><button id="addTime">插入时间</button></div><div class="btns"><button id="clearChat">清空聊天记录</button><button id="renameChat">修改群名</button></div><div class="btns"><button onclick="closeModal()">关闭</button></div>');$('openChatCapture').onclick=()=>{closeModal();openChatCapture()};$('swapView').onclick=()=>{closeModal();swapPerspective()};$('addTime').onclick=()=>{const t=prompt('输入时间提示，例如：昨天 20:30');if(t){activeChat().messages.push({type:'time',text:t});save();closeModal();renderMessages()}};$('clearChat').onclick=()=>{if(confirm('确定清空当前聊天记录？')){activeChat().messages=[];save();closeModal();renderMessages()}};$('renameChat').onclick=()=>{const c=activeChat();if(c.type!=='group'){alert('单聊暂不支持修改标题');return}const n=prompt('输入新的群聊名称',c.name);if(n?.trim()){c.name=n.trim();save();$('chatTitle').textContent=c.name;closeModal()}}}
$('addBtn').onclick=()=>openModal('<h3>开始使用</h3><div class="btns"><button class="primary" id="newPerson">＋ 添加人物</button><button id="newSingle">创建单聊</button></div><div class="btns"><button id="newGroup">创建群聊</button><button onclick="closeModal()">取消</button></div>');$('sheet').addEventListener('click',e=>{if(e.target.id==='newPerson'){closeModal();addPerson()}if(e.target.id==='newGroup')createGroup();if(e.target.id==='newSingle')newSingleChat()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showView(b.dataset.view));$('backBtn').onclick=()=>showView('chatsView');$('sendBtn').onclick=sendMessage;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});$('switchSender').onclick=switchSender;$('chatMenu').onclick=chatMenu;$('managePeople').onclick=()=>showView('contactsView');$('createGroup').onclick=createGroup;$('backupData').onclick=backupData;$('emojiBtn').onclick=toggleEmojiPanel;
renderChats();renderContacts();renderMe();
</script></body></html>
