    .panel{background:white;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #24334b0a}textarea{width:100%;height:42vh;border:0;outline:0;resize:none;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:#202b3c}input,button{font-family:inherit}.action{border:0;border-radius:14px;background:#1684e8;color:white;padding:11px 16px;font-size:15px}.muted{color:#7c8797;font-size:13px}
    .chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{align-self:flex-end;background:#2f9bff;color:white;padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:82%;line-height:1.45}.chat-input{display:flex;gap:8px;margin-top:12px}.chat-input input{flex:1;min-width:0;border:0;background:#fff;border-radius:18px;padding:12px 14px;font-size:15px}
    .wallpapers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.wallpapers button{height:70px;border:2px solid white;border-radius:15px}.photo-preview{width:100%;max-height:45vh;object-fit:contain;border-radius:16px}
    .music-card{text-align:center;margin-top:12px;padding:22px 16px}.music-disc{width:145px;height:145px;border-radius:50%;margin:8px auto 18px;background:radial-gradient(circle,#242424 0 8%,#e8e8e8 9% 12%,#282828 13% 18%,#d51c2a 19% 100%);display:grid;place-items:center;color:#fff;font-size:35px;box-shadow:0 8px 24px #0002}.chat-row{display:flex;align-items:center;gap:12px;background:#fff;padding:12px;border-radius:16px;margin-bottom:10px}.chat-avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#e8f4ff;font-size:23px}

    /* 消消乐 */
    .game-shell{display:flex;flex-direction:column;gap:12px;min-height:0;flex:1;overflow:auto;padding-bottom:8px}
    .game-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

  /* 手机屏幕适配 */
@media (max-width: 600px) {
  .phone {
    width: 100vw;
    height: 100dvh;
    max-height: none;
    min-height: 0;
    border-radius: 0;
    border: none;
  }

  .content {
    height: calc(100% - 52px);
    padding: 12px 16px 12px;
  }

  .clock {
    font-size: 58px;
    margin-top: 4px;
  }

  .weather {
    margin-top: 14px;
    height: 110px;
    padding: 13px 18px;
  }

  .page-grid {
    margin-top: 16px;
    row-gap: 13px;
    column-gap: 5px;
  }

  .icon {
    width: clamp(48px, 15vw, 65px);
    height: clamp(48px, 15vw, 65px);
    border-radius: 17px;
  }

  .app-name {
    font-size: 11px;
  }

  .dock {
    height: 70px;
    margin-bottom: 8px;
  }

  .dock .icon {
    width: 49px;
    height: 49px;
  }
}
  /* 锁屏界面 */
.lock-screen {
  position: absolute;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 18vh;
  color: white;
  background: linear-gradient(160deg, #64748b, #1e293b 65%, #0f172a);
}

.lock-time {
  font-size: 76px;
  font-weight: 300;
  letter-spacing: 2px;
}

.lock-date {
  margin-top: 8px;
  font-size: 17px;
}

.lock-box {
  width: 78%;
  margin-top: 100px;
  text-align: center;
}

.lock-box p {
  font-size: 15px;
}

.lock-box input {
  box-sizing: border-box;
  width: 100%;
  height: 48px;
  margin: 15px 0;
  border: 1px solid rgba(255,255,255,.5);
  border-radius: 14px;
  background: rgba(255,255,255,.15);
  color: white;
  text-align: center;
  font-size: 22px;
  letter-spacing: 8px;
  outline: none;
}

.lock-box button {
  width: 100%;
  height: 46px;
  border: none;
  border-radius: 14px;
  background: white;
  color: #263449;
  font-size: 16px;
}

#lockError {
  color: #ffd2d2;
  min-height: 20px;
}

                                                                                                                                                                                                                                                                                                                                                                                          const $ = id => document.getElementById(id);
                                                                                                                                                                                                                                                                                                                                                                                          function updateTime(){
                                                                                                                                                                                                                                                                                                                                                                                            const now=new Date(),time=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
                                                                                                                                                                                                                                                                                                                                                                                              $('statusTime').textContent=time;$('bigClock').textContent=time;
                                                                                                                                                                                                                                                                                                                                                                                                const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
                                                                                                                                                                                                                                                                                                                                                                                                  $('dateText').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                  updateTime();setInterval(updateTime,1000);

                                                                                                                                                                                                                                                                                                                                                                                                  /* 桌面翻页：支持触屏左右滑动，也支持点击下方圆点 */
                                                                                                                                                                                                                                                                                                                                                                                                  let currentPage=0;
                                                                                                                                                                                                                                                                                                                                                                                                  function showPage(page){
                                                                                                                                                                                                                                                                                                                                                                                                    currentPage=Math.max(0,Math.min(1,page));
                                                                                                                                                                                                                                                                                                                                                                                                      $('pagesTrack').style.transform=`translateX(-${currentPage*50}%)`;
                                                                                                                                                                                                                                                                                                                                                                                                        [...$('pageDots').children].forEach((dot,index)=>dot.classList.toggle('active',index===currentPage));
                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                        (function enablePageSwipe(){
                                                                                                                                                                                                                                                                                                                                                                                                          const area=$('pagesViewport');let startX=0,startY=0,tracking=false;
                                                                                                                                                                                                                                                                                                                                                                                                            area.addEventListener('touchstart',event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                startX=event.touches[0].clientX;startY=event.touches[0].clientY;tracking=true;
                                                                                                                                                                                                                                                                                                                                                                                                                  },{passive:true});
                                                                                                                                                                                                                                                                                                                                                                                                                    area.addEventListener('touchend',event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                        if(!tracking)return;tracking=false;
                                                                                                                                                                                                                                                                                                                                                                                                                            const dx=event.changedTouches[0].clientX-startX;
                                                                                                                                                                                                                                                                                                                                                                                                                                const dy=event.changedTouches[0].clientY-startY;
                                                                                                                                                                                                                                                                                                                                                                                                                                    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))showPage(currentPage+(dx<0?1:-1));
                                                                                                                                                                                                                                                                                                                                                                                                                                      },{passive:true});
                                                                                                                                                                                                                                                                                                                                                                                                                                        let mouseStart=0;
                                                                                                                                                                                                                                                                                                                                                                                                                                          area.addEventListener('mousedown',event=>{mouseStart=event.clientX});
                                                                                                                                                                                                                                                                                                                                                                                                                                            area.addEventListener('mouseup',event=>{const dx=event.clientX-mouseStart;if(Math.abs(dx)>45)showPage(currentPage+(dx<0?1:-1))});
                                                                                                                                                                                                                                                                                                                                                                                                                                            })();

                                                                                                                                                                                                                                                                                                                                                                                                                                            function openApp(name){
                                                                                                                                                                                                                                                                                                                                                                                                                                              $('appTitle').textContent=name;$('appView').classList.add('show');
                                                                                                                                                                                                                                                                                                                                                                                                                                                const body=$('appBody');
                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(name==='手记'||name==='备忘录'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                      body.innerHTML=`<div class="panel"><div class="muted">自动保存在这台设备</div><textarea id="noteText" placeholder="记录一点今天的想法……"></textarea></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('noteText').value=localStorage.getItem('myPhoneNote')||'';
                                                                                                                                                                                                                                                                                                                                                                                                                                                              $('noteText').addEventListener('input',event=>localStorage.setItem('myPhoneNote',event.target.value));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }else if(name==='网易云音乐'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    body.innerHTML=`<div class="panel music-card"><div class="music-disc">♫</div><h2 id="trackName">网易云音乐 · 本地试听</h2><p class="muted" id="trackInfo">选择平板里的音频文件播放</p><input type="file" id="audioFile" accept="audio/*" style="max-width:100%;margin:12px auto"><audio id="audioPlayer" controls style="width:100%;margin-top:12px"></audio><p class="muted">这是仿网易云风格的本地播放器，不连接真实网易云账号或在线曲库。</p></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        $('audioFile').onchange=event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const file=event.target.files[0];if(!file)return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $('trackName').textContent=file.name.replace(/\.[^.]+$/,'');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('trackInfo').textContent='已载入本地音频';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                $('audioPlayer').src=URL.createObjectURL(file);$('audioPlayer').play().catch(()=>{});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };}else if(name==='微信'){
  const key='myWechatData_v2';
  let wd=JSON.parse(localStorage.getItem(key)||'null')||{me:{name:'我',wxid:'mywechat',sign:'',avatar:'🙂'},contacts:[{id:'wx1',name:'文件传输助手',wxid:'filehelper',sign:'',avatar:'📁',messages:[{id:'m1',from:'them',type:'text',text:'你好！欢迎使用模拟微信。',time:Date.now()-60000}]}],moments:[]};
  let active=null,tab='chats',quoteId=null,selected=new Set(),shotMode=false;
  const save=()=>localStorage.setItem(key,JSON.stringify(wd));
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const contact=()=>wd.contacts.find(x=>x.id===active);
  const avatar=(v,cls='wx-avatar')=>v&&String(v).startsWith('data:')?'<img class="'+cls+'" src="'+v+'">':'<span class="'+cls+' wx-emoji-avatar">'+esc(v||'🙂')+'</span>';
  const stamp=t=>new Date(t||Date.now()).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  function shell(){body.innerHTML='<div class="wx-page" style="height:100%;display:flex;flex-direction:column"><div class="wx-toolbar"><strong id="wxTitle" style="flex:1">微信</strong><button id="wxAdd">＋</button></div><div id="wxContent" style="flex:1;min-height:0;overflow:auto"></div><nav class="wx-tabs"><button data-tab="chats">微信</button><button data-tab="contacts">通讯录</button><button data-tab="discover">发现</button><button data-tab="me">我</button></nav></div><div class="wx-sheet" id="wxSheet"><div class="wx-sheet-card"><h3 id="wxSheetTitle"></h3><div id="wxSheetBody"></div></div></div><input id="wxUpload" type="file" accept="image/*" hidden><input id="wxMultiUpload" type="file" accept="image/*" multiple hidden><input id="wxAudioUpload" type="file" accept="audio/*" hidden>';
    body.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;renderTab()});body.querySelector('#wxAdd').onclick=()=>{openSheet('添加联系人','<label>昵称<input id="newName" placeholder="联系人昵称"></label><label>微信号<input id="newWxid" placeholder="微信号（可选）"></label><div class="wx-actions"><button data-close>取消</button><button class="primary" id="createContact">创建</button></div>');body.querySelector('#createContact').onclick=()=>{let n=body.querySelector('#newName').value.trim();if(!n){toastWx('请填写昵称');return}wd.contacts.push({id:'c'+Date.now(),name:n,wxid:body.querySelector('#newWxid').value.trim(),sign:'',avatar:'🙂',messages:[]});save();closeSheet();renderTab()}};body.querySelector('#wxUpload').onchange=uploadImage;body.querySelector('#wxMultiUpload').onchange=uploadMomentImages;body.querySelector('#wxAudioUpload').onchange=uploadAudio;renderTab()}
  function openSheet(title,html){body.querySelector('#wxSheetTitle').textContent=title;body.querySelector('#wxSheetBody').innerHTML=html;body.querySelector('#wxSheet').classList.add('show');body.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeSheet)}
  function closeSheet(){body.querySelector('#wxSheet').classList.remove('show')}
  function renderTab(){body.querySelector('#wxTitle').textContent=({chats:'微信',contacts:'通讯录',discover:'发现',me:'我'})[tab];let el=body.querySelector('#wxContent');
    if(tab==='chats'||tab==='contacts'){el.innerHTML=wd.contacts.length?wd.contacts.map(c=>'<button class="wx-contact" data-open="'+esc(c.id)+'">'+avatar(c.avatar)+'<span style="flex:1;text-align:left"><strong>'+esc(c.name)+'</strong><small>'+esc(c.messages?.length?preview(c.messages.at(-1)):'暂无消息')+'</small></span></button>').join(''):'<div class="wx-empty">还没有联系人，点击右上角＋添加</div>';el.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openChat(x.dataset.open))}
    if(tab==='discover'){el.innerHTML='<div class="wx-moment-actions"><button id="publishMoment">✎ 发布朋友圈</button></div>'+wd.moments.slice().reverse().map(m=>'<article class="wx-moment">'+avatar(m.avatar)+'<div><b>'+esc(m.name)+'</b><p>'+esc(m.text)+'</p>'+(m.images||[]).map(src=>'<img class="wx-moment-img" src="'+src+'">').join('')+'<small>'+esc(m.timeLabel||stamp(m.time))+'</small><div><button data-like="'+m.id+'">♡ '+(m.likes||0)+'</button><button data-comment="'+m.id+'">评论</button></div>'+(m.comments||[]).map(c=>'<p class="wx-comment"><b>'+esc(c.name)+'：</b>'+esc(c.text)+'</p>').join('')+'</div></article>').join('');el.querySelector('#publishMoment').onclick=publishMoment;el.querySelectorAll('[data-like]').forEach(x=>x.onclick=()=>{let m=wd.moments.find(z=>String(z.id)===x.dataset.like);m.likes=(m.likes||0)+1;save();renderTab()});el.querySelectorAll('[data-comment]').forEach(x=>x.onclick=()=>commentMoment(x.dataset.comment))}
    if(tab==='me'){el.innerHTML='<button class="wx-contact" id="editMe">'+avatar(wd.me.avatar)+'<span><strong>'+esc(wd.me.name)+'</strong><small>微信号：'+esc(wd.me.wxid)+'</small></span>　›</button><div class="wx-menu-row">收藏　›</div><div class="wx-menu-row">设置　›</div>';el.querySelector('#editMe').onclick=()=>editProfile(wd.me,true)}
  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function renderMatchGame(body){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      body.innerHTML=`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="game-shell">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="game-stats">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="game-stat"><strong id="gameScore">0</strong><span>当前分数</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="game-stat"><strong id="gameMoves">25</strong><span>剩余步数</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="game-stat"><strong>500</strong><span>目标分数</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="game-toolbar"><span class="muted">交换相邻糖果，连成三个即可消除</span><button class="game-new" id="gameRestart">重新开始</button></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="game-board" id="gameBoard"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="game-message" id="gameMessage">选择一个糖果，再选择旁边的糖果交换</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="game-help">横向或纵向连成三个及以上相同图案即可得分。达到 500 分获胜！</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const symbols=['🍓','🍋','🍇','🍊','🍏','🍬'];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const size=8,target=500;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let board=[],score=0,moves=25,selected=-1,busy=false,ended=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const boardEl=$('gameBoard'),scoreEl=$('gameScore'),movesEl=$('gameMoves'),messageEl=$('gameMessage');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const randomCandy=()=>Math.floor(Math.random()*symbols.length);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const cell=(r,c)=>r*size+c;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function findMatches(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const found=new Set();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                for(let r=0;r<size;r++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for(let c=0;c<size;c++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const kind=board[cell(r,c)];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let row=[cell(r,c)],col=[cell(r,c)];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              for(let x=c-1;x>=0&&board[cell(r,x)]===kind;x--)row.push(cell(r,x));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for(let x=c+1;x<size&&board[cell(r,x)]===kind;x++)row.push(cell(r,x));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              for(let y=r-1;y>=0&&board[cell(y,c)]===kind;y--)col.push(cell(y,c));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for(let y=r+1;y<size&&board[cell(y,c)]===kind;y++)col.push(cell(y,c));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(row.length>=3)row.forEach(i=>found.add(i));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(col.length>=3)col.forEach(i=>found.add(i));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return [...found];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function hasPossibleMove(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for(let r=0;r<size;r++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  for(let c=0;c<size;c++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const a=cell(r,c),neighbors=[c<size-1?cell(r,c+1):-1,r<size-1?cell(r+1,c):-1];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  for(const b of neighbors){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(b<0)continue;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      [board[a],board[b]]=[board[b],board[a]];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const valid=findMatches().length>0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          [board[a],board[b]]=[board[b],board[a]];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(valid)return true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function makeBoard(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  board=[];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for(let r=0;r<size;r++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for(let c=0;c<size;c++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let value=randomCandy(),guard=0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            while(guard<30&&(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      (c>=2&&board[cell(r,c-1)]===value&&board[cell(r,c-2)]===value)||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                (r>=2&&board[cell(r-1,c)]===value&&board[cell(r-2,c)]===value)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        )){value=randomCandy();guard++;}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                board.push(value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(!hasPossibleMove())makeBoard();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
