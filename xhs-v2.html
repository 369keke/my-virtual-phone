<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f7f7">
<title>小红书主页 · 全新页面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e9e9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#242424}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}
#phone{width:min(100%,480px);height:100dvh;min-height:560px;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.status{height:29px;flex:none;padding:5px 22px 0;background:#f7f7f7;font-size:12px;display:flex;justify-content:space-between}
#page{flex:1;min-height:0;overflow:auto;background:#f7f7f7}
.cover{height:190px;background:linear-gradient(135deg,#b8b8bb,#55555a);background-size:cover;background-position:center;position:relative;color:white;padding:20px 24px}
.topline{display:flex;align-items:center;justify-content:space-between}.iconbtn{background:transparent;color:inherit;font-size:27px;padding:0 3px}.editbtn{background:#ffffffed;color:#333;border-radius:22px;padding:10px 17px;font-size:14px}
.profile{background:#55555a;color:white;padding:0 24px 22px}.identity{display:flex;gap:16px;align-items:center;margin-top:-58px;position:relative}.avatar{width:94px;height:94px;border-radius:50%;border:3px solid white;background:#eee;color:#999;display:grid;place-items:center;font-size:40px;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.person{min-width:0;padding-top:42px}.person h1{font-size:23px;margin:0 0 12px;line-height:1.2}.meta{font-size:13px;color:#eee;line-height:1.8}.stats{display:flex;gap:22px;margin:23px 0 16px}.stats strong{font-size:17px;margin-right:4px}.bio{font-size:14px;white-space:pre-wrap;line-height:1.5}.buttons{display:flex;gap:10px;margin-top:18px}.buttons button{height:45px;flex:1;border-radius:11px;font-size:16px}.follow{background:#ff2442;color:white}.message{background:#ffffff1a;border:1px solid #aaa;color:white}
.tabs{height:60px;background:white;display:flex;align-items:stretch;border-bottom:1px solid #eee;position:sticky;top:0;z-index:2}.tabs button{background:white;flex:1;color:#888;font-size:16px;position:relative}.tabs button.active{color:#222;font-weight:700}.tabs button.active:after{content:"";position:absolute;bottom:0;left:35%;width:30%;height:3px;border-radius:3px;background:#ff2442}
#posts{min-height:260px;background:#f7f7f7;padding:12px 10px}.empty{height:220px;display:grid;place-items:center;color:#aaa;font-size:14px}.post{background:white;border-radius:12px;margin:8px 0;padding:14px}.post h3{font-size:16px;margin:0 0 8px}.post p{font-size:14px;white-space:pre-wrap;line-height:1.5;margin:0 0 10px}.postfoot{font-size:11px;color:#999;display:flex;justify-content:space-between;align-items:center}.postfoot button{background:#f3f3f3;border-radius:14px;padding:5px 10px;color:#666}
.bottom{height:62px;flex:none;display:flex;justify-content:space-around;align-items:center;background:white;border-top:1px solid #eee}.bottom button{background:white;color:#777;font-size:13px}.bottom .add{width:65px;height:48px;border-radius:12px;background:#ff2442;color:white;font-size:30px;line-height:1}
.sheetbg{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}.sheetbg.show{display:flex}.sheet{width:min(100%,480px);max-height:88dvh;overflow:auto;background:#fafafa;border-radius:18px 18px 0 0;padding:18px 18px 28px}.sheet h2{font-size:18px;margin:0 0 12px}.field{display:block;width:100%;border:1px solid #ddd;background:white;border-radius:9px;padding:12px;margin:9px 0;outline:none}.field:focus{border-color:#ff2442}textarea.field{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;padding:12px;border-radius:9px}.save{background:#ff2442;color:white}.cancel{background:#eee;color:#444}
@media(min-width:600px){#phone{height:92dvh;margin:4dvh auto;border-radius:22px}}
</style></head>
<body><div id="phone">
<div class="status"><span id="clock">16:30</span><span>5G　▮▮▮　▰</span></div>
<main id="page">
<section class="cover" id="cover"><div class="topline"><button class="iconbtn" onclick="toast('菜单')">☰</button><button class="editbtn" id="editProfileBtn">✎ 编辑此主页</button><button class="iconbtn" onclick="toast('分享主页')">↗</button></div></section>
<section class="profile"><div class="identity"><div class="avatar" id="avatar">🧸</div><div class="person"><h1 id="name">momo</h1><div class="meta">小红书号：<span id="uid">123456</span><br>IP：<span id="ip">北京</span></div></div></div>
<div class="stats"><div><strong id="following">99</strong>关注</div><div><strong id="fans">99</strong>粉丝</div><div><strong id="likes">99</strong>获赞与收藏</div></div><div class="bio" id="bio">个人标签</div>
<div class="buttons" id="visitorButtons"><button class="follow" onclick="this.textContent=this.textContent==='关注'?'已关注':'关注'">关注</button><button class="message" onclick="toast('私信功能暂未连接')">发私信</button></div>
</section>
<nav class="tabs"><button id="notesTab" class="active" onclick="switchTab('notes')">笔记</button><button id="collectTab" onclick="switchTab('collect')">收藏</button><button onclick="toast('搜索主页笔记')">⌕</button></nav>
<section id="posts"></section>
</main>
<nav class="bottom"><button onclick="toast('首页')">首页</button><button onclick="toast('市集')">市集</button><button class="add" onclick="openComposer()">＋</button><button onclick="toast('消息')">消息</button><button onclick="toast('我的')">我</button></nav>
</div>
<div class="sheetbg" id="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div id="sheetContent"></div></div></div>
<script>
const KEY='xhs-clean-page-v1';
const defaults={name:'momo',uid:'123456',ip:'北京',bio:'个人标签',avatar:'🧸',cover:'',following:99,fans:99,likes:99,notes:[],collects:[]};
let profile;try{profile=JSON.parse(localStorage.getItem(KEY))||defaults}catch(e){profile=defaults}
let activeTab='notes';
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(profile))}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const n=document.createElement('div');n.textContent=s;n.style='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:10px 16px;border-radius:20px;font-size:13px;z-index:20';document.body.append(n);setTimeout(()=>n.remove(),1600)}
function render(){ $('name').textContent=profile.name;$('uid').textContent=profile.uid;$('ip').textContent=profile.ip;$('bio').textContent=profile.bio;$('following').textContent=profile.following;$('fans').textContent=profile.fans;$('likes').textContent=profile.likes;$('avatar').innerHTML=profile.avatar.startsWith('http')||profile.avatar.startsWith('data:')?'<img src="'+safe(profile.avatar)+'">':safe(profile.avatar);$('cover').style.background=profile.cover?'center/cover url("'+profile.cover.replace(/"/g,'')+'")':'linear-gradient(135deg,#b8b8bb,#55555a)';renderPosts()}
function switchTab(t){activeTab=t;$('notesTab').classList.toggle('active',t==='notes');$('collectTab').classList.toggle('active',t==='collect');renderPosts()}
function renderPosts(){const arr=profile[activeTab];$('posts').innerHTML=arr.length?arr.map((n,i)=>'<article class="post"><h3>'+safe(n.title)+'</h3><p>'+safe(n.text)+'</p><div class="postfoot"><span>'+safe(n.date||'刚刚发布')+'</span><button onclick="editNote('+i+')">编辑 / 删除</button></div></article>').join(''):'<div class="empty">'+(activeTab==='notes'?'还没有发布笔记':'还没有收藏内容')+'</div>'}
function showSheet(html){$('sheetContent').innerHTML=html;$('sheetbg').classList.add('show')}function closeSheet(){$('sheetbg').classList.remove('show')}
function editProfile(){showSheet('<h2>编辑主页资料</h2><input class="field" id="fName" placeholder="昵称" value="'+safe(profile.name)+'"><input class="field" id="fUid" placeholder="小红书号" value="'+safe(profile.uid)+'"><input class="field" id="fIp" placeholder="IP属地" value="'+safe(profile.ip)+'"><input class="field" id="fAvatar" placeholder="头像 emoji 或图片链接" value="'+safe(profile.avatar)+'"><input class="field" id="fCover" placeholder="背景图片链接（可选）" value="'+safe(profile.cover)+'"><textarea class="field" id="fBio" placeholder="个人标签 / 简介">'+safe(profile.bio)+'</textarea><div class="actions"><input class="field" id="fFollowing" type="number" placeholder="关注" value="'+profile.following+'"><input class="field" id="fFans" type="number" placeholder="粉丝" value="'+profile.fans+'"><input class="field" id="fLikes" type="number" placeholder="获赞与收藏" value="'+profile.likes+'"></div><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="save" onclick="saveProfile()">保存</button></div>')}
function saveProfile(){profile.name=$('fName').value.trim()||'momo';profile.uid=$('fUid').value;profile.ip=$('fIp').value;profile.avatar=$('fAvatar').value||'🧸';profile.cover=$('fCover').value;profile.bio=$('fBio').value;profile.following=+$('fFollowing').value||0;profile.fans=+$('fFans').value||0;profile.likes=+$('fLikes').value||0;save();closeSheet();render()}
function openComposer(){showSheet('<h2>发布笔记</h2><input class="field" id="nTitle" placeholder="填写标题"><textarea class="field" id="nText" placeholder="分享此刻的生活…"></textarea><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="save" onclick="publishNote()">发布</button></div>')}
function publishNote(){const title=$('nTitle').value.trim(),text=$('nText').value.trim();if(!title&&!text)return toast('先写一点内容吧');profile[activeTab].unshift({title,text,date:new Date().toLocaleDateString()});save();closeSheet();renderPosts()}
function editNote(i){const n=profile[activeTab][i];showSheet('<h2>笔记管理</h2><input class="field" id="editTitle" value="'+safe(n.title)+'"><textarea class="field" id="editText">'+safe(n.text)+'</textarea><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="cancel" onclick="if(confirm(\'确定删除这篇内容？\')){profile[activeTab].splice('+i+',1);save();closeSheet();renderPosts()}">删除</button><button class="save" onclick="profile[activeTab]['+i+'].title=$('+'editTitle'+').value;profile[activeTab]['+i+'].text=$('+'editText'+').value;save();closeSheet();renderPosts()">保存</button></div>')}
$('editProfileBtn').addEventListener('click',editProfile);
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);render();save();
</script></body></html>
